<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>塔位費用計算器｜梅園、壽園</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf5ea; --card:#fffdf8; --ink:#3b2f26; --muted:#76665a; --line:#e4d9c6;
  --accent:#c2532f; --accent-ink:#ffffff; --accent-soft:#f7e4d9;
  --gold:#8f6526; --warn-bg:#fbf1d8; --field:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
    --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
    --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
  --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
  --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:104px;
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 8px}
h1,h2{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;margin:0;line-height:1.35}
h1{font-size:28px;letter-spacing:.04em}
h2{font-size:20px}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:16px 0}
.card h2 .n{color:var(--accent);margin-right:6px}
.q{font-weight:600;margin:18px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  flex:1 1 auto;min-height:48px;padding:8px 14px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);border-radius:10px;font:inherit;text-align:left;cursor:pointer;
}
.chip small{display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.35}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.chips.two .chip{flex:1 1 calc(50% - 8px)}
.chips.three .chip{flex:1 1 calc(33% - 8px)}
.chip.wide{flex:1 1 100%}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:18px}
.banner.idle{background:var(--warn-bg)}
.banner b{display:block}
.line{border:1px solid var(--line);border-radius:12px;padding:6px 14px 16px;margin:14px 0;background:var(--bg)}
.line-h{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font:inherit;min-height:48px;padding:0 6px;cursor:pointer;text-decoration:underline}
select{
  width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:0 12px
}
.qtyrow{display:flex;align-items:center;gap:10px}
.qtyrow button{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qtyrow input{
  width:64px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:20px;font-weight:700;text-align:center;
}
.calc{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
.calc .tier{font-size:15px;color:var(--gold);font-weight:600;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row small{display:block;color:var(--muted);font-size:13px}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sum{font-weight:700;border-bottom:0}
.row.total{font-size:22px;font-weight:700;color:var(--accent);border-bottom:0;padding-top:12px}
.btn{
  min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-weight:700;cursor:pointer
}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.add{width:100%;background:transparent;border:1.5px dashed var(--accent);color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical
}
details{margin:16px 0}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details ul{margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
details li{margin:6px 0}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.bar .amt{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;gap:8px;padding:10px 0;margin-top:4px}
.tabs .chip{flex:1 1 50%;text-align:center;min-height:58px;font-size:19px;font-weight:600}
.tabs .chip small{font-size:13px}
.panel[hidden]{display:none}
.panel > .sub{margin:4px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>塔位費用計算器</h1>
    <p class="sub">梅園（冬山鄉立）與壽園（羅東鎮立），依各館收費標準試算</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="選擇納骨塔">
    <button type="button" role="tab" class="chip" id="tab-my" data-panel="panel-my" aria-selected="true">梅園<small>冬山鄉立</small></button>
    <button type="button" role="tab" class="chip" id="tab-sy" data-panel="panel-sy" aria-selected="false">壽園<small>羅東鎮立</small></button>
  </nav>

  <section class="panel" id="panel-my" role="tabpanel" aria-labelledby="tab-my">
    <p class="sub">冬山鄉立殯葬管理所，依收費標準（109.2.1 版）試算</p>
    <main class="app"></main>
    <div class="bar">
      <div class="bar-in">
        <div><div class="lbl">預估總額</div><div class="amt">請先填資格</div></div>
        <button type="button" class="btn" data-a="copy">複製摘要</button>
      </div>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
  </section>

  <section class="panel" id="panel-sy" role="tabpanel" aria-labelledby="tab-sy" hidden>
    <p class="sub">羅東鎮立殯葬管理所（壽園寶塔、福恩塔），依 115 年 6 月修訂收費標準試算</p>
    <main class="app"></main>
    <div class="bar">
      <div class="bar-in">
        <div><div class="lbl">預估總額</div><div class="amt">請先選戶籍</div></div>
        <button type="button" class="btn" data-a="copy">複製摘要</button>
      </div>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
  </section>
</div>

<script id="app-my">
(function(){
'use strict';

/* ───────── 價目資料（冬山鄉立殯葬管理所 收費標準 109.2.1）───────── */
const BOX = {
  personal_flat:{A:20000,D:16000,M:28000,B:40000,C:60000,mgmt:15000,
    R:{fee:0,mgmt:14000,deco:2000},L:{fee:0,mgmt:0,deco:0},W:{fee:0,mgmt:14000,deco:0}},
  personal_eye:{A:25000,D:20000,M:35000,B:50000,C:80000,mgmt:15000,
    R:{fee:5000,mgmt:14000,deco:2000},L:{fee:5000,mgmt:0,deco:0},W:{fee:5000,mgmt:14000,deco:0}},
  couple_flat:{A:36000,D:28800,M:50400,B:72000,C:120000,mgmt:15000},
  couple_eye:{A:50000,D:40000,M:70000,B:100000,C:160000,mgmt:15000},
  urn_hi:{A:40000,D:32000,M:56000,B:80000,C:120000,mgmt:18500,R:{fee:24000,mgmt:17500,deco:4000}},
  urn_lo:{A:36000,D:28800,M:50400,B:72000,C:110000,mgmt:18500,R:{fee:20000,mgmt:17500,deco:4000}}
};
const MOVE = {personal:10000,couple:15000,urn:10000,family:30000};

const MULT = {E:1.6,F:1,G:0.8,H:0.6};
const FAM = [
  {id:'31u',g:'a',seats:8, F:300000,label:'8 位｜60×30×140cm 上排'},
  {id:'31d',g:'a',seats:12,F:540000,label:'12 位｜60×30×200cm 下排'},
  {id:'32u',g:'a',seats:10,F:380000,label:'10 位｜60×30×170cm 上排'},
  {id:'32d',g:'a',seats:10,F:460000,label:'10 位｜60×30×170cm 下排'},
  {id:'41u',g:'b',seats:16,F:480000,label:'16 位｜60×60×140cm 上排'},
  {id:'41d',g:'b',seats:24,F:960000,label:'24 位｜60×60×200cm 下排'},
  {id:'42u',g:'b',seats:20,F:620000,label:'20 位｜60×60×170cm 上排'},
  {id:'42d',g:'b',seats:20,F:820000,label:'20 位｜60×60×170cm 下排'},
  {id:'31uh',g:'c',seats:4,F:150000,label:'4 位｜30×30×140cm 上排'},
  {id:'31dh',g:'c',seats:6,F:270000,label:'6 位｜30×30×200cm 下排'},
  {id:'32uh',g:'c',seats:5,F:190000,label:'5 位｜30×30×170cm 上排'},
  {id:'32dh',g:'c',seats:5,F:230000,label:'5 位｜30×30×170cm 下排'}
];
const FAM_G = {a:'60×30 系列（表3-1、3-2）',b:'60×60 系列（表4-1、4-2）',c:'半櫃 30×30（整櫃規費÷2）'};
const famOf = id => FAM.find(f=>f.id===id) || FAM[0];
const famFee = (id,t) => Math.round(famOf(id).F * MULT[t]);
const famMgmt = id => famOf(id).seats * 10000;

// 【修改】受葬人狀況擴充亡者本人戶籍選項（本鄉籍、三村村民）
const KINDS = {
  personal:{name:'個人式',spec:'30×30×30cm',unit:'座',decs:['none','vil','ds','M','R','L','W'],
    grps:[['eye','平視層','3、5–8 層'],['flat','非平視層','1、2、9–12 層']]},
  couple:{name:'夫妻式',spec:'60×30×30cm',unit:'座（2 位）',decs:['none','vil','ds','M'],
    grps:[['eye','平視層','3、5–8 層'],['flat','非平視層','1、2、9–12 層']]},
  urn:{name:'儲骨櫃',spec:'42×69×42cm',unit:'座',decs:['none','vil','ds','M','R'],
    grps:[['hi','第 1–3 層',''],['lo','第 5–6 層','']]},
  family:{name:'家族式',spec:'4–24 位',unit:'櫃',decs:['none','ds','M','R'],grps:null}
};

const DEC = {
  none:'一般（無身分優惠）',
  vil:'亡者設籍鹿埔／得安／廣興村（滿3年）',
  ds:'亡者設籍冬山鄉（滿3年或曾滿6年）',
  M:'葬於本鄉公墓內起掘',
  R:'葬於公告遷葬區',
  L:'低收入戶死亡者',
  W:'本鄉民因公作戰、演習死亡'
};

const AT_LABEL = {
  A:'本鄉籍，堂位 5 折',
  D:'鹿埔／得安／廣興村，堂位 4 折',
  B:'宜蘭縣民標準價',
  C:'外縣市價',
  M:'葬於本鄉公墓內，堂位 7 折',
  R:'葬於公告遷葬區',
  L:'低收入戶死亡者',
  W:'因公作戰、演習死亡者'
};
const FT_LABEL = {E:'外縣市價（標準價×1.6）',F:'宜蘭縣民標準價',G:'葬於本鄉公墓內，8 折',H:'本鄉籍或遷葬區，6 折'};
const RES_LABEL = {ds:'冬山鄉',yl:'宜蘭縣其他鄉鎮市',ot:'外縣市'};

/* ───────── 計算 ───────── */

function feeOf(key,tier){
  const p = BOX[key];
  return ['A','D','B','C','M'].includes(tier) ? p[tier] : p[tier].fee;
}

function calcBox(l,at){
  const p = BOX[l.kind+'_'+l.grp];
  const c = [{tier:at,fee:p[at],mgmt:p.mgmt,deco:0}];

  // 【修改】將亡者（受葬人）之鄉民與村民優惠加入比較，自動取最低
  if(l.dec==='vil') c.push({tier:'D',fee:p.D,mgmt:p.mgmt,deco:0});
  if(l.dec==='ds')  c.push({tier:'A',fee:p.A,mgmt:p.mgmt,deco:0});
  if(l.dec==='M')   c.push({tier:'M',fee:p.M,mgmt:p.mgmt,deco:0});
  if(['R','L','W'].includes(l.dec) && p[l.dec]) c.push({tier:l.dec,fee:p[l.dec].fee,mgmt:p[l.dec].mgmt,deco:p[l.dec].deco});

  c.forEach(x=>x.sum=x.fee+x.mgmt+x.deco);
  c.sort((a,b)=>a.sum-b.sum);
  const b = c[0];

  let moveFee=0, diff=0;
  if(l.move){
    moveFee = MOVE[l.kind];
    if(b.tier==='R' && (at==='A'||at==='D'||l.dec==='ds'||l.dec==='vil')) moveFee = 0;   // 遷葬區：本鄉籍不收換位費（限一次）
    const tk = l.kind+'_'+(l.target||l.grp);
    diff = Math.max(0, feeOf(tk,b.tier) - b.fee);
  }
  return finish(l,b,AT_LABEL[b.tier],moveFee,diff, b.tier!==at);
}

function calcFam(l,at){
  const base = {A:'H',D:'H',B:'F',C:'E'}[at];
  const tiers = [base];
  if(l.dec==='ds') tiers.push('H'); // 亡者為本鄉籍，家族式享6折
  if(l.dec==='M') tiers.push('G');
  if(l.dec==='R') tiers.push('H');
  if(l.half) tiers.push('H');
  let best=null;
  tiers.forEach(t=>{const f=famFee(l.fam,t); if(!best||f<best.fee) best={tier:t,fee:f};});
  const b = {tier:best.tier,fee:best.fee,mgmt:famMgmt(l.fam),deco:0};
  let moveFee=0, diff=0;
  if(l.move){
    moveFee = MOVE.family;
    diff = Math.max(0, famFee(l.target||l.fam,b.tier) - b.fee);
  }
  return finish(l,b,FT_LABEL[b.tier],moveFee,diff, b.tier!==base);
}

function finish(l,b,label,moveFee,diff,better){
  const unit = b.fee+b.mgmt+b.deco+moveFee+diff;
  return {tier:b.tier,tierLabel:label,fee:b.fee,mgmt:b.mgmt,deco:b.deco,moveFee,diff,qty:l.qty,unit,sub:unit*l.qty,better};
}

const calc = (l,at) => l.kind==='family' ? calcFam(l,at) : calcBox(l,at);

const PLAQUE = {s:{name:'小型',spec:'9×23×3.5cm',price:30000},l:{name:'大型',spec:'16×23×6cm',price:50000}};
function calcPlaque(p){
  const base=PLAQUE[p.size].price, pick=p.pick?Math.round(base*0.1):0;
  return {base,pick,qty:p.qty,unit:base+pick,sub:(base+pick)*p.qty};
}
function tempOwned(){return S.temp.owned===null ? S.lines.length>0 : S.temp.owned;}
function calcTemp(){
  const t=S.temp; if(!t.on) return null;
  let unit,label,note='';
  if(t.mode==='half'){unit=3000;label='臨時寄存半年期優惠';}
  else if(t.mode==='year'){unit=6000;label='臨時寄存一年期優惠';}
  else{
    const free=tempOwned()?30:0, pay=Math.max(0,t.days-free);
    unit=pay*200;
    label='按日計費 '+t.days+' 天';
    note=free?('已購置存放設施，前 30 天免收；計費 '+pay+' 天 × 200'):'每日 200 元';
  }
  return {label,note,unit,qty:t.qty,sub:unit*t.qty};
}

function totals(res){
  const t={fee:0,mgmt:0,deco:0,move:0,diff:0,plaque:0,temp:0,all:0};
  res.forEach(r=>{ if(!r) return;
    t.fee+=r.fee*r.qty; t.mgmt+=r.mgmt*r.qty; t.deco+=r.deco*r.qty;
    t.move+=r.moveFee*r.qty; t.diff+=r.diff*r.qty; t.all+=r.sub; });
  S.plaques.forEach(p=>{t.plaque+=calcPlaque(p).sub;});
  const tp=calcTemp(); if(tp) t.temp=tp.sub;
  t.all+=t.plaque+t.temp;
  return t;
}

/* ───────── 狀態 ───────── */

const KEY='tower-calc-dongshan-v2';
let nextId=1;
function newLine(){return {id:nextId++,kind:'personal',grp:'eye',fam:'31u',dec:'none',half:false,qty:1,move:false,target:null};}
function fresh(){return {res:null,yr3:null,vil:null,yl1:null,lines:[newLine()],plaques:[],temp:{on:false,mode:'day',days:30,qty:1,owned:null}};}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.lines)){
      s.plaques=Array.isArray(s.plaques)?s.plaques:[];
      s.temp=s.temp||{on:false,mode:'day',days:30,qty:1,owned:null};
      const ids=s.lines.concat(s.plaques).map(x=>x.id);
      nextId=(ids.length?Math.max.apply(null,ids):0)+1; return s;
    }
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S = load() || fresh();

function appTier(){
  if(!S.res) return null;
  if(S.res==='ds'){
    if(S.yr3===true) return S.vil===null ? null : (S.vil?'D':'A');
    if(S.yr3===false) return S.yl1===null ? null : (S.yl1?'B':'C');
    return null;
  }
  if(S.res==='yl'){
    if(S.yr3===true) return 'A';
    if(S.yr3===false) return S.yl1===null ? null : (S.yl1?'B':'C');
    return null;
  }
  if(S.yr3===true) return 'A';
  if(S.yr3===false) return 'C';
  return null;
}

/* ───────── 畫面 ───────── */

const root = document.getElementById('panel-my');
const $ = s => root.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const money = n => 'NT$ '+fmt(n);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function chip(label,on,attrs,sub,cls){
  return '<button type="button" class="chip'+(on?' on':'')+(cls?' '+cls:'')+'" aria-pressed="'+(on?'true':'false')+'" '+attrs+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';
}
function yn(field,text){
  const v=S[field];
  return '<div class="q">'+text+'</div><div class="chips two">'
    +chip('是',v===true,'data-a="yn" data-f="'+field+'" data-v="1"')
    +chip('否',v===false,'data-a="yn" data-f="'+field+'" data-v="0"')+'</div>';
}

/* ───────── 互動 ───────── */

function toast(msg){
  const t=$('.toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

async function doCopy(){
  const at=appTier();
  if(S.lines.length && !at){toast('請先完成申請人資格');return;}
  const text=summary(at,S.lines.map(l=>calc(l,at)));
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(ok) toast('已複製，可貼到 LINE');
  else{
    toast('無法自動複製，請在文字摘要框內全選複製');
    const sum=$('.sum'); if(sum){sum.scrollIntoView({block:'center'}); sum.focus(); sum.select();}
  }
}

function act(d){
  const l = d.id ? S.lines.find(x=>String(x.id)===String(d.id)) : null;
  const pl = d.id ? S.plaques.find(x=>String(x.id)===String(d.id)) : null;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  switch(d.a){
    case 'res': S.res=d.v; S.yr3=S.vil=S.yl1=null; break;
    case 'yn':
      S[d.f]=(d.v==='1');
      if(d.f==='yr3'){S.vil=null;S.yl1=null;}
      break;
    case 'add': S.lines.push(newLine()); break;
    case 'del': S.lines=S.lines.filter(x=>x!==l); break;
    case 'kind':
      l.kind=d.v; l.grp=(d.v==='urn'?'hi':'eye'); l.half=false; l.move=false; l.target=null;
      if(!KINDS[d.v].decs.includes(l.dec)) l.dec='none';
      break;
    case 'grp': l.grp=d.v; l.target=null; break;
    case 'fam': l.fam=d.v; l.target=null; break;
    case 'dec': l.dec=d.v; break;
    case 'half': l.half=!l.half; break;
    case 'qty': l.qty=Math.max(1,Math.min(99,l.qty+Number(d.v))); break;
    case 'move': l.move=!l.move; if(!l.move) l.target=null; break;
    case 'target': l.target=d.v; break;
    case 'copy': doCopy(); return;
    case 'padd': S.plaques.push({id:nextId++,size:'s',pick:false,qty:1}); break;
    case 'pdel': S.plaques=S.plaques.filter(x=>x!==pl); break;
    case 'psize': pl.size=d.v; break;
    case 'ppick': pl.pick=!pl.pick; break;
    case 'pqty': pl.qty=clamp(pl.qty+Number(d.v),1,99); break;
    case 'ton': S.temp.on=!S.temp.on; break;
    case 'tmode': S.temp.mode=d.v; break;
    case 'tdays': S.temp.days=clamp(S.temp.days+Number(d.v),1,60); break;
    case 'tset': S.temp.days=Number(d.v); break;
    case 'towned': S.temp.owned=(d.v==='1'); break;
    case 'tqty': S.temp.qty=clamp(S.temp.qty+Number(d.v),1,99); break;
    case 'reset': nextId=1; S=fresh(); break;
    default: return;
  }
  render();
}

root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');
  if(b) act(b.dataset);
});
root.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches && s.matches('select[data-a]')) act({a:s.dataset.a,id:s.dataset.id,v:s.value});
});
root.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;
  if (a === 'qtyinput') {
    const l = S.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); render(); }
  } else if (a === 'pqtyinput') {
    const pl = S.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); render(); }
  } else if (a === 'tdaysinput') {
    S.temp.days = Math.min(60, val); render();
  } else if (a === 'tqtyinput') {
    S.temp.qty = Math.min(99, val); render();
  }
});

window.__TC={BOX,FAM,famFee,calcBox,calcFam,totals,calcPlaque,calcTemp,getS:()=>S};
render();
})();
</script>

<script id="app-sy">
(function(){
'use strict';

/* ───────── 價目資料（羅東鎮立殯葬設施使用收費標準表，115 年 6 月修訂）───────── */
const BASE = {
  single:{lo:36000,hi:48000},
  couple:{lo:72000,hi:96000},
  urn:{'-':80000},
  family:{'6':338400,'8':434400,'10':530400,'12':626400},
  buddha:{lo:150000,hi:200000}
};

const MGF = {single:15000,couple:30000,urn:18500,buddha:30000,family:{'6':60000,'8':80000,'10':100000,'12':120000}};
const KINDS = {
  single:{name:'單人式骨甕',spec:'安置火化後骨灰',unit:'位'},
  couple:{name:'雙人式骨甕',spec:'安置骨灰，2 位',unit:'組'},
  urn:{name:'骨罈（單人式）',spec:'安置骨骸（撿骨晉塔）',unit:'位'},
  family:{name:'家族式納骨位',spec:'6–12 位，附家族牌位',unit:'組'},
  buddha:{name:'佛祖區雙人位',spec:'僅壽園寶塔一樓',unit:'組'}
};
const GRPS = {
  single:[['lo','第一、二層'],['hi','第三至八層']],
  couple:[['lo','第一、二層'],['hi','第三至七層']],
  urn:[['-','']],
  family:[['6','6 人'],['8','8 人'],['10','10 人'],['12','12 人']],
  buddha:[['lo','第一、二層'],['hi','第三至八層']]
};
const TOWER = {ba:'壽園寶塔',fu:'福恩塔'};
const RES = {
  local:{name:'羅東鎮',sub:'使用費減收 10%',banner:'本鎮鎮民：使用費減收 10%（預購長生位不適用）'},
  county:{name:'宜蘭縣其他鄉鎮市',sub:'標準價',banner:'本縣他鄉鎮市：標準價'},
  other:{name:'外縣市',sub:'使用費加一倍',banner:'設籍外縣市：使用費加一倍（2倍計收）'}
};
const PLAQUE = {plain:30000,pick:33000};
const TEMP = {y3:36000,perMonth:1000,mgmt:15000};
const MOVE_FEE = 10000, PRE_MOVE_FEE = 2000, RENAME_FEE = 2000;

/* ───────── 計算 ───────── */

function resFactor(pre){
  if(S.res==='local') return pre?1:0.9;
  if(S.res==='other') return 2;
  return 1;
}
function mgmtOf(kind,grp,tower){
  const m = kind==='family' ? MGF.family[grp] : MGF[kind];
  return tower==='ba' ? Math.round(m*0.6) : m;
}
const towerOf = l => l.kind==='buddha' ? 'ba' : l.tower;
const keyOf = l => towerOf(l)+':'+l.grp;

function calcLine(l){
  const tower=towerOf(l), f=resFactor(l.pre);
  const fee=Math.round(BASE[l.kind][l.grp]*f);
  const mgmt=mgmtOf(l.kind,l.grp,tower);
  const rename=(l.pre&&l.rename)?RENAME_FEE:0;
  let moveFee=0,dFee=0,dMgmt=0;
  if(l.move){
    const parts=(l.target||keyOf(l)).split(':'), tw=parts[0], g=parts[1];
    moveFee=l.pre?PRE_MOVE_FEE:MOVE_FEE;
    dFee=Math.max(0,Math.round(BASE[l.kind][g]*f)-fee);
    dMgmt=Math.max(0,mgmtOf(l.kind,g,l.kind==='buddha'?'ba':tw)-mgmt);
  }
  const unit=fee+mgmt+rename+moveFee+dFee+dMgmt;
  return {tower,fee,mgmt,rename,moveFee,dFee,dMgmt,qty:l.qty,unit,sub:unit*l.qty};
}

function calcPlaque(p){
  const base=p.pick?PLAQUE.pick:PLAQUE.plain;
  const unit=Math.round(base*resFactor(false));
  return {base,unit,qty:p.qty,sub:unit*p.qty};
}

function tempOwned(){return S.temp.owned===null ? S.lines.length>0 : S.temp.owned;}
function calcTemp(){
  const t=S.temp; if(!t.on) return null;
  const base=t.mode==='y3'?TEMP.y3:TEMP.perMonth*t.months;
  let use=Math.round(base*resFactor(false)), note='';
  if(tempOwned() && t.mode==='month' && t.months<=1){use=0; note='已購置本鎮設施，30 日內免收使用費';}
  const label=t.mode==='y3'?'臨時寄放 3 年':'臨時寄放 '+t.months+' 個月（切結期限）';
  return {label,use,mgmt:TEMP.mgmt,qty:t.qty,note,base,sub:(use+TEMP.mgmt)*t.qty};
}

function totals(){
  const t={fee:0,mgmt:0,rename:0,move:0,dFee:0,dMgmt:0,plaque:0,tempUse:0,tempMgmt:0,credit:0,all:0};
  S.lines.forEach(l=>{const r=calcLine(l);
    t.fee+=r.fee*r.qty; t.mgmt+=r.mgmt*r.qty; t.rename+=r.rename*r.qty;
    t.move+=r.moveFee*r.qty; t.dFee+=r.dFee*r.qty; t.dMgmt+=r.dMgmt*r.qty;});
  S.plaques.forEach(p=>{t.plaque+=calcPlaque(p).sub;});
  const tp=calcTemp();
  if(tp){t.tempUse=tp.use*tp.qty; t.tempMgmt=tp.mgmt*tp.qty; if(S.temp.credit) t.credit=Math.min(t.tempUse,t.fee);}
  t.all=t.fee+t.mgmt+t.rename+t.move+t.dFee+t.dMgmt+t.plaque+t.tempUse+t.tempMgmt-t.credit;
  return t;
}

/* ───────── 狀態 ───────── */

const KEY='tower-calc-luodong-v2';
let nextId=1;
function newLine(){return {id:nextId++,kind:'single',tower:'ba',grp:'lo',pre:false,rename:false,qty:1,move:false,target:null};}
function fresh(){return {res:null,lines:[newLine()],plaques:[],temp:{on:false,mode:'y3',months:12,qty:1,owned:null,credit:false}};}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.lines) && Array.isArray(s.plaques) && s.temp){
      const ids=s.lines.concat(s.plaques).map(x=>x.id);
      nextId=(ids.length?Math.max.apply(null,ids):0)+1; return s;
    }
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S = load() || fresh();

/* ───────── 畫面 ───────── */

const root = document.getElementById('panel-sy');
const $ = s => root.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const money = n => 'NT$ '+fmt(n);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function chip(label,on,attrs,sub,cls){
  return '<button type="button" class="chip'+(on?' on':'')+(cls?' '+cls:'')+'" aria-pressed="'+(on?'true':'false')+'" '+attrs+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';
}
function row(label,amt,note){
  return '<div class="row"><span>'+label+(note?'<small>'+note+'</small>':'')+'</span><span>'+(amt===0?'免收':(amt<0?'－'+money(-amt):money(amt)))+'</span></div>';
}
function resNote(base,pre){
  if(S.res==='local') return '標準價 '+fmt(base)+(pre?'，長生位不減收':'，鎮民減收 10%');
  if(S.res==='other') return '標準價 '+fmt(base)+' 加一倍';
  return '標準價 '+fmt(base);
}
function stepper(act,idAttr,val,unitHint){
  return '<div class="qtyrow">'
    +'<button type="button" aria-label="減少" data-a="'+act+'"'+idAttr+' data-v="-1">−</button>'
    +'<input type="number" min="1" max="99" value="'+val+'" data-a="'+act+'input"'+idAttr+'>'
    +'<button type="button" aria-label="增加" data-a="'+act+'"'+idAttr+' data-v="1">＋</button>'
    +(unitHint?'<span class="hint" style="margin:0">'+unitHint+'</span>':'')+'</div>';
}

function qualHTML(){
  let h='<section class="card"><h2><span class="n">1</span>使用者戶籍</h2>';
  h+='<div class="q">使用者的戶籍在哪裡？</div><div class="chips three">'
    +Object.keys(RES).map(k=>chip(RES[k].name,S.res===k,'data-a="res" data-v="'+k+'"',RES[k].sub)).join('')+'</div>';
  h+='<p class="hint">表上載明「設籍外縣市者，其使用費加一倍計收」。</p>';
  h+= S.res ? '<div class="banner"><b>'+RES[S.res].banner+'</b></div>' : '<div class="banner idle">選好戶籍才能算出價格。</div>';
  return h+'</section>';
}

function targetSelect(l){
  const towers=l.kind==='buddha'?['ba']:['ba','fu'];
  const cur=l.target||keyOf(l), same=keyOf(l);
  let h='<select data-a="target" data-id="'+l.id+'" aria-label="換位目標">';
  towers.forEach(tw=>GRPS[l.kind].forEach(g=>{
    const v=tw+':'+g[0];
    h+='<option value="'+v+'"'+(v===cur?' selected':'')+'>'+TOWER[tw]+(g[1]?' '+g[1]:'')+(v===same?'（同款，僅換位置）':'')+'</option>';
  }));
  return h+'</select>';
}

function lineHTML(l,i){
  const K=KINDS[l.kind], bud=l.kind==='buddha';
  let h='<div class="line"><div class="line-h"><b>項目 '+(i+1)+'</b>'
    +'<button type="button" class="link" data-a="del" data-id="'+l.id+'">刪除此項目</button></div>';

  h+='<div class="q">櫃型</div><div class="chips two">'
    +Object.keys(KINDS).map(k=>chip(KINDS[k].name,l.kind===k,'data-a="kind" data-id="'+l.id+'" data-v="'+k+'"',KINDS[k].spec)).join('')+'</div>';

  if(GRPS[l.kind].length>1){
    h+='<div class="q">'+(l.kind==='family'?'家族人數':'層別')+'</div><div class="chips two">'
      +GRPS[l.kind].map(g=>chip(g[1],l.grp===g[0],'data-a="grp" data-id="'+l.id+'" data-v="'+g[0]+'"','標準價 '+fmt(BASE[l.kind][g[0]]))).join('')+'</div>';
  }else{
    h+='<p class="hint">標準價 '+fmt(BASE[l.kind][l.grp])+'，不分層別。</p>';
  }

  if(bud){
    h+='<p class="hint">佛祖區只在壽園寶塔一樓。</p>';
  }else{
    h+='<div class="q">塔別</div><div class="chips two">'
      +['ba','fu'].map(tw=>chip(TOWER[tw],l.tower===tw,'data-a="tower" data-id="'+l.id+'" data-v="'+tw+'"','管理費 '+fmt(mgmtOf(l.kind,l.grp,tw)))).join('')+'</div>';
  }

  h+='<div class="chips" style="margin-top:14px">'+chip('預購長生位（生前預購）',l.pre,'data-a="pre" data-id="'+l.id+'"','鎮民減收 10% 不適用；需附預安奉者的戶籍謄本','wide')+'</div>';
  if(l.pre) h+='<div class="chips" style="margin-top:8px">'+chip('長生位更名',l.rename,'data-a="rename" data-id="'+l.id+'"','登記費 2,000，限一次','wide')+'</div>';

  h+='<div class="q">數量（'+K.unit+'）</div>'+stepper('qty',' data-id="'+l.id+'"',l.qty);

  h+='<div class="chips" style="margin-top:14px">'+chip('購買後要換位置',l.move,'data-a="move" data-id="'+l.id+'"',
    l.pre?'長生位換位登記費 2,000，較貴要補差額':'已晉塔換位費 10,000，較貴要補差額','wide')+'</div>';
  if(l.move) h+='<div class="q">換到</div>'+targetSelect(l);

  if(S.res){
    const r=calcLine(l), q=r.qty;
    h+='<div class="calc"><div class="tier">'+TOWER[r.tower]+' '+K.name+'</div>';
    h+=row('使用費',r.fee*q,(q>1?money(r.fee)+' × '+q+'；':'')+resNote(BASE[l.kind][l.grp],l.pre));
    h+=row('管理費',r.mgmt*q,(q>1?money(r.mgmt)+' × '+q+'；':'')+(r.tower==='ba'?'福恩塔的 60%':'福恩塔'));
    if(r.rename) h+=row('長生位更名登記費',r.rename*q);
    if(l.move){
      h+=row(l.pre?'長生位換位登記費':'已晉塔換位費',r.moveFee*q);
      h+=row('使用費補差額',r.dFee*q,'換到較貴的才補；較便宜不退');
      h+=row('管理費補差額',r.dMgmt*q);
    }
    h+='<div class="row sum"><span>此項目小計</span><span>'+money(r.sub)+'</span></div></div>';
  }
  return h+'</div>';
}

function itemsHTML(){
  let h='<section class="card"><h2><span class="n">2</span>塔位項目</h2>'
    +'<p class="hint">不同櫃型、層別、塔別，請分成不同項目。</p>';
  S.lines.forEach((l,i)=>{h+=lineHTML(l,i);});
  return h+'<button type="button" class="btn add" data-a="add">＋ 新增另一種項目</button></section>';
}

function plaqueHTML(p,i){
  let h='<div class="line"><div class="line-h"><b>牌位 '+(i+1)+'</b>'
    +'<button type="button" class="link" data-a="pdel" data-id="'+p.id+'">刪除此牌位</button></div>';
  h+='<div class="q">選位方式</div><div class="chips two">'
    +chip('非選位',!p.pick,'data-a="ppick" data-id="'+p.id+'" data-v="0"','標準價 '+fmt(PLAQUE.plain))
    +chip('自選位',p.pick,'data-a="ppick" data-id="'+p.id+'" data-v="1"','標準價 '+fmt(PLAQUE.pick))+'</div>';
  h+='<div class="q">數量（位）</div>'+stepper('pqty',' data-id="'+p.id+'"',p.qty);
  if(S.res){
    const c=calcPlaque(p);
    h+='<div class="calc">'+row('牌位使用費',c.sub,(p.qty>1?money(c.unit)+' × '+p.qty+'；':'')+resNote(c.base,false))+'</div>';
  }
  return h+'</div>';
}

function tempHTML(){
  const t=S.temp;
  let h='<div class="q" style="margin-top:22px">臨時寄放骨灰（骸）</div><div class="chips">'
    +chip('需要臨時寄放',t.on,'data-a="ton"','','wide')+'</div>';
  if(!t.on) return h;
  h+='<div class="q">寄放期限</div><div class="chips two">'
    +chip('3 年',t.mode==='y3','data-a="tmode" data-v="y3"','一次性，標準價 '+fmt(TEMP.y3))
    +chip('切結較短期限',t.mode==='month','data-a="tmode" data-v="month"','按月，每月 '+fmt(TEMP.perMonth))+'</div>';
  if(t.mode==='month'){
    h+='<div class="q">寄放月數</div>'+stepper('tmonths','',t.months,'最長 36 個月');
    h+='<div class="chips" style="margin-top:8px">'+[1,3,6,12].map(m=>chip(m+' 個月',t.months===m,'data-a="tset" data-v="'+m+'"')).join('')+'</div>';
    const own=tempOwned();
    h+='<div class="q">已購置（或本次同時購買）本鎮骨灰（骸）存放設施？</div><div class="chips two">'
      +chip('是',own===true,'data-a="towned" data-v="1"','30 日內免收使用費')
      +chip('否',own===false,'data-a="towned" data-v="0"')+'</div>';
  }
  h+='<div class="q">數量（具）</div>'+stepper('tqty','',t.qty);
  h+='<div class="chips" style="margin-top:14px">'+chip('期限屆滿前移置本鎮塔位',t.credit,'data-a="tcredit"','已繳使用費可折抵塔位使用費','wide')+'</div>';
  if(S.res){
    const c=calcTemp();
    h+='<div class="calc"><div class="tier">'+c.label+'</div>'
      +row('臨時寄放使用費',c.use*c.qty,(c.note?c.note+'；':'')+resNote(c.base,false))
      +row('臨時寄放管理費',c.mgmt*c.qty,'一次性')+'</div>';
  }
  return h;
}

function extrasHTML(){
  let h='<section class="card"><h2><span class="n">3</span>其他項目</h2>'
    +'<div class="q" style="margin-top:14px">牌位</div><p class="hint" style="margin-top:0">牌位不提供長生位、更名、換位。</p>';
  S.plaques.forEach((p,i)=>{h+=plaqueHTML(p,i);});
  h+='<button type="button" class="btn add" data-a="padd">＋ 新增牌位</button>';
  h+=tempHTML();
  return h+'</section>';
}

function descOf(l){
  const K=KINDS[l.kind], g=GRPS[l.kind].find(x=>x[0]===l.grp);
  return TOWER[towerOf(l)]+' '+K.name+(g&&g[1]?' '+g[1]:'')+(l.pre?'（預購長生位）':'');
}

function summary(){
  let s='【羅東壽園 塔位費用試算】\n使用者戶籍：'+RES[S.res].name+'（'+RES[S.res].sub+'）\n';
  S.lines.forEach((l,i)=>{
    const r=calcLine(l), q=l.qty;
    s+='\n'+(i+1)+'. '+descOf(l)+' × '+q+' '+KINDS[l.kind].unit+'\n';
    s+='   使用費 '+money(r.fee*q)+'｜管理費 '+money(r.mgmt*q);
    if(r.rename) s+='｜更名登記費 '+money(r.rename*q);
    if(l.move) s+='｜換位費 '+money(r.moveFee*q)+'｜補差額 '+money((r.dFee+r.dMgmt)*q);
    s+='\n   小計 '+money(r.sub)+'\n';
  });
  S.plaques.forEach((p,i)=>{
    const c=calcPlaque(p);
    s+='\n牌位 '+(i+1)+'. '+(p.pick?'自選位':'非選位')+' × '+p.qty+' 位\n   小計 '+money(c.sub)+'\n';
  });
  const tp=calcTemp();
  if(tp) s+='\n'+tp.label+' × '+tp.qty+' 具\n   使用費 '+money(tp.use*tp.qty)+'｜管理費 '+money(tp.mgmt*tp.qty)+'\n   小計 '+money(tp.sub)+'\n';
  const t=totals();
  if(t.credit) s+='\n臨時寄放使用費折抵：－'+money(t.credit)+'\n';
  s+='\n合計：'+money(t.all)+'\n※ 試算僅供參考，實際以羅東鎮立殯葬管理所公告與審核為準 03-9898845';
  return s;
}

function resultHTML(){
  let h='<section class="card"><h2><span class="n">4</span>費用總計</h2>';
  if(!S.res) return h+'<p class="hint">選好第 1 步的戶籍後，這裡會顯示總金額。</p></section>';
  if(!S.lines.length && !S.plaques.length && !S.temp.on) return h+'<p class="hint">還沒有加入任何項目。</p></section>';
  const t=totals();
  if(S.lines.length){
    h+=row('塔位使用費',t.fee)+row('塔位管理費',t.mgmt);
    if(t.rename) h+=row('長生位更名登記費',t.rename);
    if(t.move) h+=row('換位費',t.move);
    if(t.dFee) h+=row('換位使用費補差額',t.dFee);
    if(t.dMgmt) h+=row('換位管理費補差額',t.dMgmt);
  }
  if(S.plaques.length) h+=row('牌位',t.plaque);
  if(S.temp.on){ h+=row('臨時寄放使用費',t.tempUse)+row('臨時寄放管理費',t.tempMgmt); }
  if(t.credit) h+=row('臨時寄放使用費折抵',-t.credit);
  h+='<div class="row total"><span>合計</span><span>'+money(t.all)+'</span></div>';
  h+='<div class="q">文字摘要</div><textarea class="sum" readonly rows="12">'+esc(summary())+'</textarea>';
  h+='<div class="actions"><button type="button" class="btn" data-a="copy">複製摘要</button>'
    +'<button type="button" class="btn ghost" data-a="reset">全部重來</button></div>';
  return h+'</section>';
}

function notesHTML(){
  return '<details><summary>計算依據與需要確認的地方</summary><ul>'
   +'<li>價目來自「羅東鎮立殯葬設施使用收費標準表」（115 年 6 月修訂）的背面，只算骨灰（骸）存放設施。墓地、火化、殯儀不含。</li>'
   +'<li>本鎮鎮民減收 10%、設籍外縣市加一倍，表上寫在臨時寄放列的說明欄。本工具套用到塔位、牌位、臨時寄放的使用費，管理費不調整，預購長生位不減收。</li>'
   +'<li>壽園寶塔的管理費，表上寫「以福恩塔的 60%」，並寫單人 9,000。本工具依 60% 推算其他櫃型（雙人 18,000、家族 6 人 36,000 等），佛祖區以雙人式推算。</li>'
   +'<li>換位：已晉塔換位費 10,000，加使用費與管理費的補差額（換到較便宜的不退）。換位費表上寫「位」，雙人式與家族式暫以每組計。</li>'
   +'<li>長生位換位、更名登記費各 2,000，限一次；牌位不提供長生位、更名、換位。</li>'
   +'<li>臨時寄放：3 年 36,000，切結較短期限按月（每月 1,000）。管理費 15,000 一次性。已購置本鎮設施者 30 日內免收使用費。</li>'
   +'</ul></details>';
}

function render(){
  $('.app').innerHTML=qualHTML()+itemsHTML()+extrasHTML()+resultHTML()+notesHTML();
  $('.amt').textContent = S.res ? money(totals().all) : '請先選戶籍';
  save();
}

/* ───────── 互動 ───────── */

function toast(msg){
  const t=$('.toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

async function doCopy(){
  if(!S.res){toast('請先選戶籍');return;}
  const text=summary();
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(ok) toast('已複製，可貼到 LINE');
  else{
    toast('無法自動複製，請在文字摘要框內全選複製');
    const sum=$('.sum'); if(sum){sum.scrollIntoView({block:'center'}); sum.focus(); sum.select();}
  }
}

function act(d){
  const l = d.id ? S.lines.find(x=>String(x.id)===String(d.id)) : null;
  const pl = d.id ? S.plaques.find(x=>String(x.id)===String(d.id)) : null;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  switch(d.a){
    case 'res': S.res=d.v; break;
    case 'add': S.lines.push(newLine()); break;
    case 'del': S.lines=S.lines.filter(x=>x!==l); break;
    case 'kind':
      l.kind=d.v; l.grp=GRPS[d.v][0][0]; l.target=null; l.move=false;
      if(d.v==='buddha') l.tower='ba';
      break;
    case 'grp': l.grp=d.v; l.target=null; break;
    case 'tower': l.tower=d.v; l.target=null; break;
    case 'pre': l.pre=!l.pre; if(!l.pre) l.rename=false; break;
    case 'rename': l.rename=!l.rename; break;
    case 'qty': l.qty=clamp(l.qty+Number(d.v),1,99); break;
    case 'move': l.move=!l.move; if(!l.move) l.target=null; break;
    case 'target': l.target=d.v; break;
    case 'padd': S.plaques.push({id:nextId++,pick:false,qty:1}); break;
    case 'pdel': S.plaques=S.plaques.filter(x=>x!==pl); break;
    case 'ppick': pl.pick=(d.v==='1'); break;
    case 'pqty': pl.qty=clamp(pl.qty+Number(d.v),1,99); break;
    case 'ton': S.temp.on=!S.temp.on; break;
    case 'tmode': S.temp.mode=d.v; break;
    case 'tmonths': S.temp.months=clamp(S.temp.months+Number(d.v),1,36); break;
    case 'tset': S.temp.months=Number(d.v); break;
    case 'towned': S.temp.owned=(d.v==='1'); break;
    case 'tqty': S.temp.qty=clamp(S.temp.qty+Number(d.v),1,99); break;
    case 'tcredit': S.temp.credit=!S.temp.credit; break;
    case 'copy': doCopy(); return;
    case 'reset': nextId=1; S=fresh(); break;
    default: return;
  }
  render();
}

root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');
  if(b) act(b.dataset);
});
root.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches && s.matches('select[data-a]')) act({a:s.dataset.a,id:s.dataset.id,v:s.value});
});
root.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;
  if (a === 'qtyinput') {
    const l = S.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); render(); }
  } else if (a === 'pqtyinput') {
    const pl = S.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); render(); }
  } else if (a === 'tmonthsinput') {
    S.temp.months = Math.min(36, val); render();
  } else if (a === 'tqtyinput') {
    S.temp.qty = Math.min(99, val); render();
  }
});

window.__LD={calcLine,calcPlaque,calcTemp,totals,getS:()=>S,summary};
render();
})();
</script>

<script id="tabs">
(function(){
  'use strict';
  const KEY='tower-calc-tab';
  const tabs=Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function show(id,scroll){
    tabs.forEach(t=>{
      const on=t.dataset.panel===id;
      t.setAttribute('aria-selected',on?'true':'false');
      t.classList.toggle('on',on);
      document.getElementById(t.dataset.panel).hidden=!on;
    });
    try{localStorage.setItem(KEY,id);}catch(e){}
    if(scroll) window.scrollTo(0,0);
  }
  tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.panel,true)));
  let cur='panel-my';
  try{cur=localStorage.getItem(KEY)||cur;}catch(e){}
  if(!document.getElementById(cur)) cur='panel-my';
  show(cur,false);
})();
</script>
