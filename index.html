<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宜蘭縣公立塔位費用計算器｜冬山梅園・羅東壽園</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf5ea; --card:#fffdf8; --ink:#3b2f26; --muted:#76665a; --line:#e4d9c6;
  --accent:#c2532f; --accent-ink:#ffffff; --accent-soft:#f7e4d9;
  --gold:#8f6526; --warn-bg:#fbf1d8; --field:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
    --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
    --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
  --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
  --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:104px;
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 8px}
h1,h2{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;margin:0;line-height:1.35}
h1{font-size:26px;letter-spacing:.04em}
h2{font-size:20px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}

/* 園區切換頁籤 */
.park-tabs{display:flex;gap:8px;margin-top:14px;background:var(--line);padding:4px;border-radius:12px}
.park-tab{
  flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);font:inherit;font-weight:600;cursor:pointer;transition:all .15s;
}
.park-tab.on{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:16px 0}
.card h2 .n{color:var(--accent);margin-right:6px}
.q{font-weight:600;margin:18px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  flex:1 1 auto;min-height:48px;padding:8px 14px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);border-radius:10px;font:inherit;text-align:left;cursor:pointer;
}
.chip small{display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.35}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.chips.two .chip{flex:1 1 calc(50% - 8px)}
.chips.three .chip{flex:1 1 calc(33% - 8px)}
.chip.wide{flex:1 1 100%}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:18px}
.banner.idle{background:var(--warn-bg)}
.banner b{display:block}
.line{border:1px solid var(--line);border-radius:12px;padding:6px 14px 16px;margin:14px 0;background:var(--bg)}
.line-h{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font:inherit;min-height:48px;padding:0 6px;cursor:pointer;text-decoration:underline}
select{
  width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:0 12px
}
.qtyrow{display:flex;align-items:center;gap:10px}
.qtyrow button{
  width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qtyrow input{
  width:64px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:20px;font-weight:700;text-align:center;
}
.calc{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
.calc .tier{font-size:15px;color:var(--gold);font-weight:600;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row small{display:block;color:var(--muted);font-size:13px}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sum{font-weight:700;border-bottom:0}
.row.total{font-size:22px;font-weight:700;color:var(--accent);border-bottom:0;padding-top:12px}
.btn{
  min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-weight:700;cursor:pointer
}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.add{width:100%;background:transparent;border:1.5px dashed var(--accent);color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical
}
details{margin:16px 0}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details ul{margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
details li{margin:6px 0}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.bar .amt{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>宜蘭縣公立塔位費用計算器</h1>
    <div class="park-tabs" role="tablist">
      <button type="button" class="park-tab on" id="tab-ds" data-a="park" data-v="ds">冬山鄉梅園</button>
      <button type="button" class="park-tab" id="tab-ld" data-a="park" data-v="ld">羅東鎮壽園</button>
    </div>
    <p class="sub" id="parkSub">冬山鄉立納骨堂，依殯葬管理所收費標準（109.2.1）試算</p>
  </header>
  <main id="app"></main>
</div>

<div class="bar">
  <div class="bar-in">
    <div><div class="lbl" id="barParkLabel">冬山梅園 預估總額</div><div class="amt" id="barTotal">請先填資格</div></div>
    <button type="button" class="btn" data-a="copy">複製摘要</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ──────────────── 1. 冬山鄉梅園 數據庫 ──────────────── */
const DS_BOX = {
  personal_flat:{A:20000,D:16000,M:28000,B:40000,C:60000,mgmt:15000,
    R:{fee:0,mgmt:14000,deco:2000},L:{fee:0,mgmt:0,deco:0},W:{fee:0,mgmt:14000,deco:0}},
  personal_eye:{A:25000,D:20000,M:35000,B:50000,C:80000,mgmt:15000,
    R:{fee:5000,mgmt:14000,deco:2000},L:{fee:5000,mgmt:0,deco:0},W:{fee:5000,mgmt:14000,deco:0}},
  couple_flat:{A:36000,D:28800,M:50400,B:72000,C:120000,mgmt:15000},
  couple_eye:{A:50000,D:40000,M:70000,B:100000,C:160000,mgmt:15000},
  urn_hi:{A:40000,D:32000,M:56000,B:80000,C:120000,mgmt:18500,R:{fee:24000,mgmt:17500,deco:4000}},
  urn_lo:{A:36000,D:28800,M:50400,B:72000,C:110000,mgmt:18500,R:{fee:20000,mgmt:17500,deco:4000}}
};
const DS_MOVE = {personal:10000,couple:15000,urn:10000,family:30000};
const DS_MULT = {E:1.6,F:1,G:0.8,H:0.6};
const DS_FAM = [
  {id:'31u',g:'a',seats:8, F:300000,label:'8 位｜60×30×140cm 上排'},
  {id:'31d',g:'a',seats:12,F:540000,label:'12 位｜60×30×200cm 下排'},
  {id:'32u',g:'a',seats:10,F:380000,label:'10 位｜60×30×170cm 上排'},
  {id:'32d',g:'a',seats:10,F:460000,label:'10 位｜60×30×170cm 下排'},
  {id:'41u',g:'b',seats:16,F:480000,label:'16 位｜60×60×140cm 上排'},
  {id:'41d',g:'b',seats:24,F:960000,label:'24 位｜60×60×200cm 下排'},
  {id:'42u',g:'b',seats:20,F:620000,label:'20 位｜60×60×170cm 上排'},
  {id:'42d',g:'b',seats:20,F:820000,label:'20 位｜60×60×170cm 下排'},
  {id:'31uh',g:'c',seats:4,F:150000,label:'4 位｜30×30×140cm 上排'},
  {id:'31dh',g:'c',seats:6,F:270000,label:'6 位｜30×30×200cm 下排'},
  {id:'32uh',g:'c',seats:5,F:190000,label:'5 位｜30×30×170cm 上排'},
  {id:'32dh',g:'c',seats:5,F:230000,label:'5 位｜30×30×170cm 下排'}
];
const DS_FAM_G = {a:'60×30 系列（表3-1、3-2）',b:'60×60 系列（表4-1、4-2）',c:'半櫃 30×30（整櫃規費÷2）'};
const dsFamOf = id => DS_FAM.find(f=>f.id===id) || DS_FAM[0];
const dsFamFee = (id,t) => Math.round(dsFamOf(id).F * DS_MULT[t]);
const dsFamMgmt = id => dsFamOf(id).seats * 10000;

const DS_KINDS = {
  personal:{name:'個人式',spec:'30×30×30cm',unit:'座',decs:['none','M','R','L','W'],
    grps:[['eye','成人平視層','第 3、5–8 層'],['flat','非平視層','第 1、2、9–12 層']]},
  couple:{name:'夫妻式',spec:'60×30×30cm',unit:'座（2 位）',decs:['none','M'],
    grps:[['eye','成人平視層','第 3、5–8 層'],['flat','非平視層','第 1、2、9–12 層']]},
  urn:{name:'儲骨櫃',spec:'42×69×42cm',unit:'座',decs:['none','M','R'],
    grps:[['hi','第 1–3 層',''],['lo','第 5–6 層','']]},
  family:{name:'家族式',spec:'4–24 位',unit:'櫃',decs:['none','M','R'],grps:null}
};
const DS_DEC = {none:'一般（無優惠）',M:'葬於本鄉公墓內',R:'葬於公告遷葬區',L:'低收入戶死亡者',W:'因公作戰或演習死亡'};
const DS_AT_LABEL = {A:'本鄉籍，堂位 5 折',D:'鹿埔／得安／廣興村，堂位 4 折',B:'宜蘭縣民標準價',C:'外縣市價',
  M:'葬於本鄉公墓內，堂位 7 折',R:'葬於公告遷葬區',L:'低收入戶死亡者',W:'因公作戰、演習死亡者'};
const DS_FT_LABEL = {E:'外縣市價（標準價×1.6）',F:'宜蘭縣民標準價',G:'葬於本鄉公墓內，8 折',H:'本鄉籍或遷葬區，6 折'};
const DS_RES_LABEL = {ds:'冬山鄉',yl:'宜蘭縣其他鄉鎮市',ot:'外縣市'};

const DS_PLAQUE = {s:{name:'小型',spec:'9×23×3.5cm',price:30000},l:{name:'大型',spec:'16×23×6cm',price:50000}};

/* ──────────────── 2. 羅東鎮壽園 數據庫 ──────────────── */
const LD_BOX = {
  single: {
    name:'單人骨灰位',
    flat: { fee: 36000, name: '非平視層（第 1、2 層）' },
    eye:  { fee: 48000, name: '成人平視層（第 3 至 8 層）' },
    mgmt_std: 15000,
    unit: '座'
  },
  couple: {
    name:'雙人骨灰位',
    flat: { fee: 72000, name: '非平視層（第 1、2 層）' },
    eye:  { fee: 96000, name: '成人平視層（第 3 至 7 層）' },
    mgmt_std: 30000,
    unit: '組'
  },
  buddha: {
    name:'佛祖區雙人位（寶塔一樓）',
    flat: { fee: 150000, name: '非平視層（第 1、2 層）' },
    eye:  { fee: 200000, name: '成人平視層（第 3 至 8 層）' },
    mgmt_std: 30000,
    unit: '組'
  },
  urn: {
    name:'骨罈（骨骸位）',
    flat: { fee: 80000, name: '全區標準位' },
    eye:  { fee: 80000, name: '全區標準位' },
    mgmt_std: 18500,
    unit: '位'
  }
};
const LD_FAM = [
  { id: 'f6',  seats: 6,  fee: 338400, mgmt: 60000,  label: '6 人家族式納骨位（含牌位）' },
  { id: 'f8',  seats: 8,  fee: 434400, mgmt: 80000,  label: '8 人家族式納骨位（含牌位）' },
  { id: 'f10', seats: 10, fee: 530400, mgmt: 100000, label: '10 人家族式納骨位（含牌位）' },
  { id: 'f12', seats: 12, fee: 626400, mgmt: 120000, label: '12 人家族式納骨位（含牌位）' }
];
const ldFamOf = id => LD_FAM.find(f => f.id === id) || LD_FAM[0];
const LD_PLAQUE = {
  normal: { name: '非選位', fee: 30000 },
  pick:   { name: '自選位（加收10%）', fee: 33000 }
};
const LD_RES_LABEL = { ld: '羅東鎮民', yl: '宜蘭縣其他鄉鎮市', ot: '外縣市民眾' };

/* ──────────────── 3. 跨園區狀態架構 ──────────────── */
const KEY = 'tower-calc-yilan-combo-v1';
let nextId = 1;

function newDsLine() {
  return { id: nextId++, kind:'personal', grp:'eye', fam:'31u', dec:'none', half:false, qty:1, move:false, target:null };
}
function newLdLine() {
  return { id: nextId++, tower:'shouyuan', kind:'single', grp:'eye', fam:'f6', isAlive:false, qty:1, move:false, targetGrp:'eye' };
}

function freshState() {
  return {
    park: 'ds', // 'ds' 冬山梅園, 'ld' 羅東壽園
    ds: {
      res: null, yr3: null, vil: null, yl1: null,
      lines: [newDsLine()],
      plaques: [],
      temp: { on:false, mode:'day', days:30, qty:1, owned:null }
    },
    ld: {
      res: null,
      lines: [newLdLine()],
      plaques: [],
      temp: { on:false, owned:null, qty:1 }
    }
  };
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.ds && s.ld) {
      const allIds = s.ds.lines.concat(s.ds.plaques, s.ld.lines, s.ld.plaques).map(x => x.id);
      nextId = (allIds.length ? Math.max.apply(null, allIds) : 0) + 1;
      return s;
    }
  } catch(e){}
  return null;
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
let S = loadState() || freshState();

/* ──────────────── 4. 冬山計算邏輯 ──────────────── */
function dsAppTier() {
  const d = S.ds;
  if (!d.res) return null;
  if (d.res === 'ds') {
    if (d.yr3 === true) return d.vil === null ? null : (d.vil ? 'D' : 'A');
    if (d.yr3 === false) return d.yl1 === null ? null : (d.yl1 ? 'B' : 'C');
    return null;
  }
  if (d.res === 'yl') {
    if (d.yr3 === true) return 'A';
    if (d.yr3 === false) return d.yl1 === null ? null : (d.yl1 ? 'B' : 'C');
    return null;
  }
  if (d.yr3 === true) return 'A';
  if (d.yr3 === false) return 'C';
  return null;
}
function dsFeeOf(key, tier) {
  const p = DS_BOX[key];
  return ['A','D','B','C','M'].includes(tier) ? p[tier] : p[tier].fee;
}
function dsCalcBox(l, at) {
  const p = DS_BOX[l.kind + '_' + l.grp];
  const c = [{ tier: at, fee: p[at], mgmt: p.mgmt, deco: 0 }];
  if (l.dec === 'M') c.push({ tier: 'M', fee: p.M, mgmt: p.mgmt, deco: 0 });
  if (['R','L','W'].includes(l.dec) && p[l.dec]) c.push({ tier: l.dec, fee: p[l.dec].fee, mgmt: p[l.dec].mgmt, deco: p[l.dec].deco });
  c.forEach(x => x.sum = x.fee + x.mgmt + x.deco);
  c.sort((a,b) => a.sum - b.sum);
  const b = c[0];
  let moveFee = 0, diff = 0;
  if (l.move) {
    moveFee = DS_MOVE[l.kind];
    if (b.tier === 'R' && (at === 'A' || at === 'D')) moveFee = 0;
    const tk = l.kind + '_' + (l.target || l.grp);
    diff = Math.max(0, dsFeeOf(tk, b.tier) - b.fee);
  }
  const unit = b.fee + b.mgmt + b.deco + moveFee + diff;
  return { tier: b.tier, tierLabel: DS_AT_LABEL[b.tier], fee: b.fee, mgmt: b.mgmt, deco: b.deco, moveFee, diff, qty: l.qty, unit, sub: unit * l.qty, better: b.tier !== at };
}
function dsCalcFam(l, at) {
  const base = { A:'H', D:'H', B:'F', C:'E' }[at];
  const tiers = [base];
  if (l.dec === 'M') tiers.push('G');
  if (l.dec === 'R') tiers.push('H');
  if (l.half) tiers.push('H');
  let best = null;
  tiers.forEach(t => { const f = dsFamFee(l.fam, t); if (!best || f < best.fee) best = { tier: t, fee: f }; });
  const b = { tier: best.tier, fee: best.fee, mgmt: dsFamMgmt(l.fam), deco: 0 };
  let moveFee = 0, diff = 0;
  if (l.move) {
    moveFee = DS_MOVE.family;
    diff = Math.max(0, dsFamFee(l.target || l.fam, b.tier) - b.fee);
  }
  const unit = b.fee + b.mgmt + b.deco + moveFee + diff;
  return { tier: b.tier, tierLabel: DS_FT_LABEL[b.tier], fee: b.fee, mgmt: b.mgmt, deco: b.deco, moveFee, diff, qty: l.qty, unit, sub: unit * l.qty, better: b.tier !== base };
}
function dsCalcPlaque(p) {
  const base = DS_PLAQUE[p.size].price, pick = p.pick ? Math.round(base * 0.1) : 0;
  return { base, pick, qty: p.qty, unit: base + pick, sub: (base + pick) * p.qty };
}
function dsTempOwned() {
  return S.ds.temp.owned === null ? S.ds.lines.length > 0 : S.ds.temp.owned;
}
function dsCalcTemp() {
  const t = S.ds.temp; if (!t.on) return null;
  let unit, label, note = '';
  if (t.mode === 'half') { unit = 3000; label = '臨時寄存半年期優惠'; }
  else if (t.mode === 'year') { unit = 6000; label = '臨時寄存一年期優惠'; }
  else {
    const free = dsTempOwned() ? 30 : 0, pay = Math.max(0, t.days - free);
    unit = pay * 200;
    label = '按日計費 ' + t.days + ' 天';
    note = free ? ('已購置存放設施，前 30 天免收；計費 ' + pay + ' 天 × 200') : '每日 200 元';
  }
  return { label, note, unit, qty: t.qty, sub: unit * t.qty };
}
function dsTotals(resArr) {
  const t = { fee: 0, mgmt: 0, deco: 0, move: 0, diff: 0, plaque: 0, temp: 0, all: 0 };
  resArr.forEach(r => {
    if (!r) return;
    t.fee += r.fee * r.qty; t.mgmt += r.mgmt * r.qty; t.deco += r.deco * r.qty;
    t.move += r.moveFee * r.qty; t.diff += r.diff * r.qty; t.all += r.sub;
  });
  S.ds.plaques.forEach(p => { t.plaque += dsCalcPlaque(p).sub; });
  const tp = dsCalcTemp(); if (tp) t.temp = tp.sub;
  t.all += t.plaque + t.temp;
  return t;
}

/* ──────────────── 5. 羅東計算邏輯 ──────────────── */
function ldCalcLine(l, res) {
  let baseFee = 0, mgmt = 0, tierLabel = '';
  if (l.kind === 'family') {
    const f = ldFamOf(l.fam);
    baseFee = f.fee; mgmt = f.mgmt; tierLabel = f.label;
  } else {
    const b = LD_BOX[l.kind];
    baseFee = b[l.grp].fee;
    mgmt = l.tower === 'shouyuan' ? Math.round(b.mgmt_std * 0.6) : b.mgmt_std;
    tierLabel = b.name + ' · ' + b[l.grp].name;
  }
  let usageFee = baseFee, discNote = '';
  if (res === 'ld') {
    if (l.isAlive) {
      discNote = '羅東鎮民（長生位無 9 折）';
      usageFee = baseFee;
    } else {
      discNote = '羅東鎮民（使用費減收 10%）';
      usageFee = Math.round(baseFee * 0.9);
    }
  } else if (res === 'yl') {
    discNote = '宜蘭縣民標準價';
    usageFee = baseFee;
  } else if (res === 'ot') {
    discNote = '外縣市民眾加成價';
    usageFee = baseFee;
  }
  let moveFee = 0, diff = 0;
  if (l.move) {
    moveFee = 10000;
    if (l.kind !== 'family') {
      const b = LD_BOX[l.kind];
      const targetBase = b[l.targetGrp || l.grp].fee;
      const targetFee = (res === 'ld' && !l.isAlive) ? Math.round(targetBase * 0.9) : targetBase;
      diff = Math.max(0, targetFee - usageFee);
    }
  }
  const unitTotal = usageFee + mgmt + moveFee + diff;
  return { tierLabel, discNote, usageFee, mgmt, moveFee, diff, qty: l.qty, unitTotal, sub: unitTotal * l.qty };
}
function ldCalcPlaque(p) {
  const item = LD_PLAQUE[p.type];
  return { name: item.name, unit: item.fee, qty: p.qty, sub: item.fee * p.qty };
}
function ldCalcTemp() {
  const t = S.ld.temp; if (!t.on) return null;
  const fee = 36000, mgmt = 15000;
  const note = t.owned ? '已購置存放設施，30 日內免收使用費；逾期按月計收' : '3 年期一次性使用費與管理費';
  const unit = fee + mgmt;
  return { label: '臨時寄放骨灰（3年期）', note, fee, mgmt, unit, qty: t.qty, sub: unit * t.qty };
}
function ldTotals(resArr) {
  const t = { usage: 0, mgmt: 0, move: 0, diff: 0, plaque: 0, temp: 0, all: 0 };
  resArr.forEach(r => {
    if (!r) return;
    t.usage += r.usageFee * r.qty;
    t.mgmt += r.mgmt * r.qty;
    t.move += r.moveFee * r.qty;
    t.diff += r.diff * r.qty;
    t.all += r.sub;
  });
  S.ld.plaques.forEach(p => { t.plaque += ldCalcPlaque(p).sub; });
  const tp = ldCalcTemp(); if (tp) t.temp = tp.sub;
  t.all += t.plaque + t.temp;
  return t;
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function chip(label, on, attrs, sub, cls) {
  return '<button type="button" class="chip' + (on ? ' on' : '') + (cls ? ' ' + cls : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" ' + attrs + '>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</button>';
}
function row(label, amt, note) {
  return '<div class="row"><span>' + label + (note ? '<small>' + note + '</small>' : '') + '</span><span>' + (amt === 0 ? '免收' : money(amt)) + '</span></div>';

  S.ld.lines.forEach((l, i) => {
    const r = resArr[i]; if (!r) return;
    const towerName = l.tower === 'shouyuan' ? '壽園寶塔' : '福恩塔';
    s += '\n' + (i + 1) + '. 【' + towerName + '】' + r.tierLabel + (l.isAlive ? '（長生位）' : '') + ' × ' + l.qty + '\n';
    s += '   適用依據：' + r.discNote + '\n';
    s += '   使用規費：' + money(r.usageFee * l.qty) + '｜管理費：' + money(r.mgmt * l.qty);

    s += '\n   項目小計：' + money(r.sub) + '\n';

  S.ld.plaques.forEach((p, i) => {

/* ──────────────── 10. 事件互動與通知 ──────────────── */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function doCopy() {
  let text = '';
  if (S.park === 'ds') {
    const at = dsAppTier();
    if (S.ds.lines.length && !at) { toast('請先完成冬山申請人資格'); return; }
    text = dsSummary(at, S.ds.lines.map(l => (l.kind === 'family' ? dsCalcFam(l, at) : dsCalcBox(l, at))));
  } else {
    if (S.ld.lines.length && !S.ld.res) { toast('請先選擇羅東身分資格'); return; }
    text = ldSummary(S.ld.lines.map(l => ldCalcLine(l, S.ld.res)));
  }

  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    } catch(e2){}
  }
  if (ok) toast('已複製報價，可直接貼入 LINE');
  else {
    toast('請在摘要框內全選複製');
    const sum = $('#sum'); if (sum) { sum.scrollIntoView({block:'center'}); sum.focus(); sum.select(); }
  }
}

function act(d) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 園區切換
  if (d.a === 'park') { S.park = d.v; render(); return; }
  if (d.a === 'copy') { doCopy(); return; }

  // 冬山梅園事件
  if (d.a.startsWith('ds_')) {
    const actName = d.a.replace('ds_', '');
    const l = d.id ? S.ds.lines.find(x => String(x.id) === String(d.id)) : null;
    const pl = d.id ? S.ds.plaques.find(x => String(x.id) === String(d.id)) : null;

    switch (actName) {
      case 'res': S.ds.res = d.v; S.ds.yr3 = S.ds.vil = S.ds.yl1 = null; break;
      case 'yn':
        S.ds[d.f] = (d.v === '1');
        if (d.f === 'yr3') { S.ds.vil = null; S.ds.yl1 = null; }
        break;
      case 'add': S.ds.lines.push(newDsLine()); break;
      case 'del': S.ds.lines = S.ds.lines.filter(x => x !== l); break;
      case 'kind':
        l.kind = d.v; l.grp = (d.v === 'urn' ? 'hi' : 'eye'); l.half = false; l.move = false; l.target = null;
        if (!DS_KINDS[d.v].decs.includes(l.dec)) l.dec = 'none';
        break;
      case 'grp': l.grp = d.v; l.target = null; break;
      case 'fam': l.fam = d.v; l.target = null; break;
      case 'dec': l.dec = d.v; break;
      case 'half': l.half = !l.half; break;
      case 'qty': l.qty = clamp(l.qty + Number(d.v), 1, 99); break;
      case 'move': l.move = !l.move; if (!l.move) l.target = null; break;
      case 'target': l.target = d.v; break;
      case 'padd': S.ds.plaques.push({ id: nextId++, size:'s', pick:false, qty:1 }); break;
      case 'pdel': S.ds.plaques = S.ds.plaques.filter(x => x !== pl); break;
      case 'psize': pl.size = d.v; break;
      case 'ppick': pl.pick = !pl.pick; break;
      case 'pqty': pl.qty = clamp(pl.qty + Number(d.v), 1, 99); break;
      case 'ton': S.ds.temp.on = !S.ds.temp.on; break;
      case 'tmode': S.ds.temp.mode = d.v; break;
      case 'tdays': S.ds.temp.days = clamp(S.ds.temp.days + Number(d.v), 1, 60); break;
      case 'towned': S.ds.temp.owned = (d.v === '1'); break;
      case 'tqty': S.ds.temp.qty = clamp(S.ds.temp.qty + Number(d.v), 1, 99); break;
      case 'reset': S.ds = freshState().ds; break;
    }
  }

  // 羅東壽園事件
  if (d.a.startsWith('ld_')) {
    const actName = d.a.replace('ld_', '');
    const l = d.id ? S.ld.lines.find(x => String(x.id) === String(d.id)) : null;
    const pl = d.id ? S.ld.plaques.find(x => String(x.id) === String(d.id)) : null;

    switch (actName) {
      case 'res': S.ld.res = d.v; break;
      case 'add': S.ld.lines.push(newLdLine()); break;
      case 'del': S.ld.lines = S.ld.lines.filter(x => x !== l); break;
      case 'tower': l.tower = d.v; break;
      case 'kind': l.kind = d.v; l.move = false; break;
      case 'grp': l.grp = d.v; l.targetGrp = d.v; break;
      case 'fam': l.fam = d.v; break;
      case 'alive': l.isAlive = !l.isAlive; break;
      case 'qty': l.qty = clamp(l.qty + Number(d.v), 1, 99); break;
      case 'move': l.move = !l.move; break;
      case 'target': l.targetGrp = d.v; break;
      case 'padd': S.ld.plaques.push({ id: nextId++, type:'normal', qty:1 }); break;
      case 'pdel': S.ld.plaques = S.ld.plaques.filter(x => x !== pl); break;
      case 'ptype': pl.type = d.v; break;
      case 'pqty': pl.qty = clamp(pl.qty + Number(d.v), 1, 99); break;
      case 'ton': S.ld.temp.on = !S.ld.temp.on; break;
      case 'towned': S.ld.temp.owned = (d.v === '1'); break;
      case 'tqty': S.ld.temp.qty = clamp(S.ld.temp.qty + Number(d.v), 1, 99); break;
      case 'reset': S.ld = freshState().ld; break;
    }
  }

  render();
}

});

document.addEventListener('change', e => {
  const s = e.target;
  if (s.matches && s.matches('select[data-a]')) {
    act({ a: s.dataset.a, id: s.dataset.id, v: s.value });
  }
});

document.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;

  if (a === 'ds_qtyinput') {
    const l = S.ds.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); render(); }
  } else if (a === 'ds_pqtyinput') {
    const pl = S.ds.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); render(); }
  } else if (a === 'ds_tdaysinput') {
    S.ds.temp.days = Math.min(60, val); render();
  } else if (a === 'ds_tqtyinput') {
    S.ds.temp.qty = Math.min(99, val); render();
  } else if (a === 'ld_qtyinput') {
    const l = S.ld.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); render(); }
  } else if (a === 'ld_pqtyinput') {
    const pl = S.ld.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); render(); }
  } else if (a === 'ld_tqtyinput') {
    S.ld.temp.qty = Math.min(99, val); render();
  }
});

render();
})();
</script>
</body>
</html>
