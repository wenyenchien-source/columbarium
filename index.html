<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宜蘭公立塔位費用計算器｜福園・壽園・梅園・五結蘭園</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf5ea; --card:#fffdf8; --ink:#3b2f26; --muted:#76665a; --line:#e4d9c6;
  --accent:#c2532f; --accent-ink:#ffffff; --accent-soft:#f7e4d9;
  --gold:#8f6526; --warn-bg:#fbf1d8; --field:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
    --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
    --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1712; --card:#262019; --ink:#f0e7d8; --muted:#b9a993; --line:#3d342a;
  --accent:#e2805b; --accent-ink:#1c1712; --accent-soft:#3b2b22;
  --gold:#d8aa5f; --warn-bg:#3a3020; --field:#2d261e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:104px;
}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 8px}
h1,h2{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;margin:0;line-height:1.35}
h1{font-size:26px;letter-spacing:.04em}
h2{font-size:20px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;gap:6px;padding:10px 0 6px;margin-top:6px;overflow-x:auto}
.tabs .chip{flex:1 1 auto;text-align:center;min-height:54px;font-size:16px;font-weight:600;padding:6px 10px;white-space:nowrap}
.tabs .chip small{font-size:12px;font-weight:400}
.tabs .chip.disabled{opacity:.45;cursor:not-allowed}
.panel[hidden]{display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:16px 0}
.card h2 .n{color:var(--accent);margin-right:6px}
.q{font-weight:600;margin:18px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  flex:1 1 auto;min-height:48px;padding:8px 14px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);border-radius:10px;font:inherit;text-align:left;cursor:pointer;
}
.chip small{display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.35}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.chips.two .chip{flex:1 1 calc(50% - 8px)}
.chips.three .chip{flex:1 1 calc(33% - 8px)}
.chip.wide{flex:1 1 100%}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,.link:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-top:18px}
.banner.idle{background:var(--warn-bg)}
.banner b{display:block}
.line{border:1px solid var(--line);border-radius:12px;padding:6px 14px 16px;margin:14px 0;background:var(--bg)}
.line-h{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.link{background:none;border:0;color:var(--accent);font:inherit;min-height:48px;padding:0 6px;cursor:pointer;text-decoration:underline}
select{
  width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:0 12px
}
.qtyrow{display:flex;align-items:center;gap:10px}
.qtyrow button{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qtyrow input{
  width:64px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);
  color:var(--ink);font-size:20px;font-weight:700;text-align:center;
}
.calc{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
.calc .tier{font-size:15px;color:var(--gold);font-weight:600;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row small{display:block;color:var(--muted);font-size:13px}
.row span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.sum{font-weight:700;border-bottom:0}
.row.total{font-size:22px;font-weight:700;color:var(--accent);border-bottom:0;padding-top:12px}
.btn{
  min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-weight:700;cursor:pointer
}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.add{width:100%;background:transparent;border:1.5px dashed var(--accent);color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical
}
details{margin:16px 0}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details ul{margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
details li{margin:6px 0}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .lbl{font-size:13px;color:var(--muted);line-height:1.2}
.bar .amt{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>宜蘭公立塔位費用計算器</h1>
    <p class="sub">依宜蘭縣各公立殯葬管理所最新自治條例標準試算</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="選擇納骨塔">
    <button type="button" role="tab" class="chip" id="tab-fy" data-panel="panel-fy" aria-selected="true">員山福園<small>宜蘭縣立・櫻花</small></button>
    <button type="button" role="tab" class="chip" id="tab-sy" data-panel="panel-sy" aria-selected="false">羅東壽園<small>羅東鎮立</small></button>
    <button type="button" role="tab" class="chip" id="tab-my" data-panel="panel-my" aria-selected="false">冬山梅園<small>冬山鄉立</small></button>
    <button type="button" role="tab" class="chip disabled" id="tab-wj" title="五結蘭園興建中，落成公告自治條例後開放" disabled>五結蘭園<small>五結鄉立・籌建中</small></button>
  </nav>

  <!-- 面板 1：員山福園與櫻花陵園 -->
  <section class="panel" id="panel-fy" role="tabpanel" aria-labelledby="tab-fy">
    <p class="sub">宜蘭縣立殯葬管理所（員山福園本館、礁溪櫻花陵園）收費標準試算</p>
    <main id="app-fy-container"></main>
    <div class="bar">
      <div class="bar-in">
        <div><div class="lbl">員山福園 預估總額</div><div class="amt" id="amt-fy">請先選設籍</div></div>
        <button type="button" class="btn" data-a="fy_copy">複製摘要</button>
      </div>
    </div>
    <div class="toast" id="toast-fy" role="status" aria-live="polite"></div>
  </section>

  <!-- 面板 2：羅東壽園 -->
  <section class="panel" id="panel-sy" role="tabpanel" aria-labelledby="tab-sy" hidden>
    <p class="sub">羅東鎮立殯葬管理所（壽園寶塔、福恩塔），依 115.7.16 修訂標準試算</p>
    <main id="app-sy-container"></main>
    <div class="bar">
      <div class="bar-in">
        <div><div class="lbl">羅東壽園 預估總額</div><div class="amt" id="amt-sy">請先選戶籍</div></div>
        <button type="button" class="btn" data-a="sy_copy">複製摘要</button>
      </div>
    </div>
    <div class="toast" id="toast-sy" role="status" aria-live="polite"></div>
  </section>

  <!-- 面板 3：冬山梅園 -->
  <section class="panel" id="panel-my" role="tabpanel" aria-labelledby="tab-my" hidden>
    <p class="sub">冬山鄉立殯葬管理所，依收費標準（109.2.1 版）試算</p>
    <main id="app-my-container"></main>
    <div class="bar">
      <div class="bar-in">
        <div><div class="lbl">冬山梅園 預估總額</div><div class="amt" id="amt-my">請先填資格</div></div>
        <button type="button" class="btn" data-a="my_copy">複製摘要</button>
      </div>
    </div>
    <div class="toast" id="toast-my" role="status" aria-live="polite"></div>
  </section>
</div>

<!-- ═════════ 腳本 1：員山福園／櫻花陵園 ═════════ -->
<script id="script-fy">
(function(){
'use strict';
const FY_PLAQUE = {
  small: { name:'小型牌位（10.8×20cm）', fee:30000 },
  large: { name:'大型牌位（21.7×40cm）', fee:60000 }
};

const KEY = 'tower-calc-fuyuan-v8';
let nextId = 1;
function newLine(){ 
  return { id:nextId++, type:'ash', park:'fuyuan', layout:'single', famType:'6', tier:'eye', qty:1, move:false }; 
}
function fresh(){ 
  return { res:'yilan', lines:[newLine()], plaques:[], temp:{ on:false, type:'ash', qty:1 } }; 
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.lines)){
      const ids = s.lines.concat(s.plaques||[]).map(x=>x.id);
      nextId = (ids.length?Math.max.apply(null,ids):0)+1; return s;
    }
  }catch(e){}
  return null;
}
function save(){ try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} }
let S = load() || fresh();

const root = document.getElementById('panel-fy');
const container = document.getElementById('app-fy-container');
const fmt = n => n.toLocaleString('en-US');
const money = n => 'NT$ '+fmt(n);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function chip(label,on,attrs,sub,cls){
  return '<button type="button" class="chip'+(on?' on':'')+(cls?' '+cls:'')+'" aria-pressed="'+(on?'true':'false')+'" '+attrs+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';
}
function row(label,amt,note){
  return '<div class="row"><span>'+label+(note?'<small>'+note+'</small>':'')+'</span><span>'+(amt===0?'免收':money(amt))+'</span></div>';
}

function calcLine(l){
  let name = '', baseUsage = 0, mgmtFee = 0, unitName = '位';
  const isAsh = l.type === 'ash';

  if (l.park === 'fuyuan') {
    if (l.layout === 'single') {
      name = isAsh ? '個人骨灰甕（小甕）' : '個人骨骸罈（大甕）';
      baseUsage = isAsh ? 40000 : 50000;
      mgmtFee = isAsh ? 14000 : 17500;
    } else if (l.layout === 'combo') {
      name = isAsh ? '合一雙骨灰甕（同時寄存2甕）' : '合一雙骨骸罈（同時寄存2罈）';
      baseUsage = isAsh ? 70000 : 80000;
      mgmtFee = isAsh ? 14000 : 17500;
      unitName = '座';
    } else if (l.layout === 'buddha') {
      name = '宗教區雙人位（限骨灰）';
      baseUsage = 100000;
      mgmtFee = 28000;
      unitName = '組';
    } else if (l.layout === 'family') {
      if (l.famType === '12') {
        name = '12 人式家族櫃（可安奉 12 位）';
        baseUsage = 600000;
        mgmtFee = 168000;
      } else {
        name = '6 人式家族櫃（可安奉 6 位）';
        baseUsage = 300000;
        mgmtFee = 84000;
      }
      unitName = '座';
    }
  } else {
    if (l.layout === 'single') {
      const isEye = l.tier === 'eye';
      if (isAsh) {
        name = isEye ? '骨灰甕 · 成人平視層（第 4、5 層）' : '骨灰甕 · 非平視層（第 1–3、6–10 層）';
        baseUsage = isEye ? 50000 : 40000;
        mgmtFee = 14000;
      } else {
        name = isEye ? '骨骸罈 · 成人平視層（第 2、3 層）' : '骨骸罈 · 非平視層（第 1、4 層）';
        baseUsage = isEye ? 60000 : 50000;
        mgmtFee = 17500;
      }
    } else if (l.layout === 'couple') {
      name = isAsh ? '雙人合奉位（骨灰，每位減收 5%）' : '雙人合奉位（骨骸，每位減收 5%）';
      baseUsage = isAsh ? 76000 : 95000;
      mgmtFee = isAsh ? 28000 : 35000;
      unitName = '組';
    } else if (l.layout === 'four') {
      name = isAsh ? '4 位合奉區（骨灰，每位減收 5%）' : '4 位合奉區（骨骸，每位減收 5%）';
      baseUsage = isAsh ? 152000 : 190000;
      mgmtFee = isAsh ? 56000 : 70000;
      unitName = '座';
    }
  }

  const isOther = S.res === 'other';
  const usageFee = isOther ? baseUsage * 2 : baseUsage;
  const moveFee = l.move ? 10000 : 0;
  const unit = usageFee + mgmtFee + moveFee;
  return { name, usageFee, mgmtFee, moveFee, unit, sub: unit * l.qty, unitName };
}

function calcPlaque(p){
  const conf = FY_PLAQUE[p.type];
  const isOther = S.res === 'other';
  const base = isOther ? conf.fee * 2 : conf.fee;
  const pick = p.pick ? 3000 : 0;
  const unit = base + pick;
  return { conf, unit, sub: unit * p.qty };
}

function calcTemp(){
  if(!S.temp.on) return null;
  const isAsh = S.temp.type === 'ash';
  const useBase = isAsh ? 40000 : 50000;
  const mgmt = isAsh ? 1200 : 1500;
  const isOther = S.res === 'other';
  const use = isOther ? useBase * 2 : useBase;
  const unit = use + mgmt;
  return { label: isAsh ? '臨時納存骨灰甕（3年）' : '臨時納存骨骸罈（3年）', unit, sub: unit * S.temp.qty };
}

function totals(){
  const t = { usage:0, mgmt:0, move:0, plaque:0, temp:0, all:0 };
  S.lines.forEach(l => {
    const r = calcLine(l);
    t.usage += r.usageFee * l.qty;
    t.mgmt += r.mgmtFee * l.qty;
    t.move += r.moveFee * l.qty;
  });
  (S.plaques||[]).forEach(p => { t.plaque += calcPlaque(p).sub; });
  const tp = calcTemp();
  if(tp) t.temp = tp.sub;
  t.all = t.usage + t.mgmt + t.move + t.plaque + t.temp;
  return t;
}

function qualHTML(){
  let h = '<section class="card"><h2><span class="n">1</span>設籍與身分</h2>';
  h += '<div class="q">適用之身分資格？</div><div class="chips two">'
    + chip('宜蘭縣民', S.res==='yilan', 'data-a="fy_res" data-v="yilan"', '標準價（曾設籍本縣滿6年同）')
    + chip('外縣市民眾', S.res==='other', 'data-a="fy_res" data-v="other"', '使用費加一倍（2倍計收）') + '</div>';
  const note = S.res==='other' ? '外縣市：使用費按標準價 2 倍計收；骨灰(骸)管理費比照縣籍民眾收費（不加倍）。' : '宜蘭縣民：依標準收費表計收。';
  h += '<div class="banner"><b>目前適用：'+(S.res==='other'?'外縣市（使用費 2 倍）':'宜蘭縣民（標準價）')+'</b><small>'+note+'</small></div>';
  return h + '</section>';
}

function lineHTML(l, i){
  let h = '<div class="line"><div class="line-h"><b>項目 '+(i+1)+'</b>'
    + '<button type="button" class="link" data-a="fy_del" data-id="'+l.id+'">刪除此項目</button></div>';

  h += '<div class="q">存放形式</div><div class="chips two">'
    + chip('骨灰甕（小甕）', l.type==='ash', 'data-a="fy_type" data-id="'+l.id+'" data-v="ash"')
    + chip('骨骸罈（大甕）', l.type==='bone', 'data-a="fy_type" data-id="'+l.id+'" data-v="bone"') + '</div>';

  h += '<div class="q">存放園區</div><div class="chips two">'
    + chip('員山福園本館', l.park==='fuyuan', 'data-a="fy_park" data-id="'+l.id+'" data-v="fuyuan"', '一般位・合奉雙人・家族位')
    + chip('礁溪櫻花陵園', l.park==='sakura', 'data-a="fy_park" data-id="'+l.id+'" data-v="sakura"', '景觀陵園・層別平視層') + '</div>';

  h += '<div class="q">格局規格</div><div class="chips">';
  if (l.park === 'fuyuan') {
    h += chip('個人位', l.layout==='single', 'data-a="fy_layout" data-id="'+l.id+'" data-v="single"', l.type==='ash'?'標準價 4 萬':'標準價 5 萬');
    h += chip('合一雙人位', l.layout==='combo', 'data-a="fy_layout" data-id="'+l.id+'" data-v="combo"', '1 櫃放 2 具合葬');
    if (l.type === 'ash') {
      h += chip('宗教區雙人位', l.layout==='buddha', 'data-a="fy_layout" data-id="'+l.id+'" data-v="buddha"', '標準價 10 萬');
    }
    h += chip('家族式納骨櫃', l.layout==='family', 'data-a="fy_layout" data-id="'+l.id+'" data-v="family"', '6 人式 / 12 人式');
  } else {
    h += chip('個人位', l.layout==='single', 'data-a="fy_layout" data-id="'+l.id+'" data-v="single"', '有平視層與非平視層');
    h += chip('雙人合奉位', l.layout==='couple', 'data-a="fy_layout" data-id="'+l.id+'" data-v="couple"', '享使用費 95 折');
    h += chip('4 位合奉區', l.layout==='four', 'data-a="fy_layout" data-id="'+l.id+'" data-v="four"', '享使用費 95 折');
  }
  h += '</div>';

  if (l.park === 'fuyuan' && l.layout === 'family') {
    h += '<div class="q">家族位容量選擇</div><div class="chips two">'
      + chip('6 人式家族櫃', l.famType==='6', 'data-a="fy_famType" data-id="'+l.id+'" data-v="6"', '總額 NT$ 38.4 萬（安奉6位）')
      + chip('12 人式家族櫃', l.famType==='12', 'data-a="fy_famType" data-id="'+l.id+'" data-v="12"', '總額 NT$ 76.8 萬（安奉12位）') + '</div>';
  }

  if (l.park === 'sakura' && l.layout === 'single') {
    const eyeDesc = l.type==='ash' ? '第 4、5 層（5 萬元）' : '第 2、3 層（6 萬元）';
    const flatDesc = l.type==='ash' ? '第 1–3、6–10 層（4 萬元）' : '第 1、4 層（5 萬元）';
    h += '<div class="q">位置層別高度</div><div class="chips two">'
      + chip('成人平視層', l.tier==='eye', 'data-a="fy_tier" data-id="'+l.id+'" data-v="eye"', eyeDesc)
      + chip('非平視層', l.tier==='flat', 'data-a="fy_tier" data-id="'+l.id+'" data-v="flat"', flatDesc) + '</div>';
  }

  const r = calcLine(l), q = l.qty;

  h += '<div class="q">購買數量（'+r.unitName+'）</div><div class="qtyrow">'

function summary(){
  let s = '【宜蘭縣立殯葬設施（福園・櫻花陵園）費用試算】\n';

  S.lines.forEach((l, i) => {
    const r = calcLine(l), q = l.qty;
    const parkName = l.park==='fuyuan' ? '員山福園' : '櫻花陵園';
    s += '\n' + (i+1) + '. 【' + parkName + '】' + r.name + ' × ' + q + ' ' + r.unitName + '\n';
    s += '   使用費：' + money(r.usageFee * q) + '｜管理費（35年）：' + money(r.mgmtFee * q);
    if(l.move) s += '｜換位手續費：' + money(r.moveFee * q);
    s += '\n   小計：' + money(r.sub) + '\n';
  });
  (S.plaques||[]).forEach((p, i) => {
    const c = calcPlaque(p);
    s += '\n牌位 ' + (i+1) + '. ' + c.conf.name + (p.pick?'（自選位置）':'') + ' × ' + p.qty + ' 位\n   小計：' + money(c.sub) + '\n';
  });
  const tp = calcTemp();
  if(tp) s += '\n' + tp.label + ' × ' + S.temp.qty + ' 具\n   小計：' + money(tp.sub) + '\n';
  const t = totals();
  s += '\n總計應繳納金額：' + money(t.all) + '\n※ 本試算依宜蘭縣立殯葬設施使用費收費標準編製，實際金額以管理所現場核發繳款單為準。電話 (03) 922-0433\n'
    + '--------------------------------\n'
    + '規費標準整理：重生禮儀（簡先生）\n'
    + '諮詢電話：0922-382533\n'
    + 'LINE：https://line.me/ti/p/XF2bg2UUic';
  return s;
}

function resultHTML(){
  let h = '<section class="card"><h2><span class="n">4</span>費用總計</h2>';
  const t = totals();
  if(S.lines.length){
    h += row('堂位使用費總計', t.usage);
    h += row('設施管理費總計（35年）', t.mgmt);

function notesHTML(){
  return '<details><summary>員山福園／櫻花陵園 收費依據與說明</summary><ul>'
   + '<li>依據「宜蘭縣立殯葬設施保證金及使用費收費標準表」自治條例編製。電話：(03) 922-0433。</li>'
   + '<li>外縣市民眾使用費按標準價 2 倍計收；骨灰(骸)管理費比照縣籍民眾收費（不加倍）。</li>'
   + '<li>管理費首次申辦一次計收 35 年。</li>'
   + '<li>福園現場家族櫃位以 6 人式（38.4萬）與 12 人式（76.8萬）為主。</li>'
   + '<li>櫻花陵園個人位第 4、5 層（骨灰）及第 2、3 層（骨骸）為成人平視層，使用費較非平視層調升 1 萬元。</li>'
   + '</ul></details>';
}

function render(){
  container.innerHTML = qualHTML() + itemsHTML() + extrasHTML() + resultHTML() + notesHTML();
  document.getElementById('amt-fy').textContent = money(totals().all);
  save();
}

function toast(msg){
  const t = document.getElementById('toast-fy'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function doCopy(){
  const text = summary();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e){
    try{
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(ok) toast('已複製報價，可直接貼入 LINE');
  else {
    toast('請在文字摘要框內全選複製');
    const sum = root.querySelector('.sum'); if(sum){ sum.scrollIntoView({block:'center'}); sum.focus(); sum.select(); }
  }
}

function act(d){
  const l = d.id ? S.lines.find(x => String(x.id)===String(d.id)) : null;
  const pl = d.id ? S.plaques.find(x => String(x.id)===String(d.id)) : null;
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  switch(d.a){
    case 'fy_res': S.res = d.v; break;
    case 'fy_add': S.lines.push(newLine()); break;
    case 'fy_del': S.lines = S.lines.filter(x => x!==l); break;
    case 'fy_type':
      l.type = d.v;
      if (l.type === 'bone' && l.layout === 'buddha') l.layout = 'single';
      break;
    case 'fy_park':
      l.park = d.v;
      l.layout = 'single';
      break;
    case 'fy_layout':
      l.layout = d.v;
      break;
    case 'fy_famType':
      l.famType = d.v;
      break;
    case 'fy_tier':
      l.tier = d.v;
      break;
    case 'fy_qty': l.qty = clamp(l.qty + Number(d.v), 1, 99); break;
    case 'fy_move': l.move = !l.move; break;
    case 'fy_padd': S.plaques = S.plaques || []; S.plaques.push({ id:nextId++, type:'small', pick:false, qty:1 }); break;
    case 'fy_pdel': S.plaques = S.plaques.filter(x => x!==pl); break;
    case 'fy_ptype': pl.type = d.v; break;
    case 'fy_ppick': pl.pick = !pl.pick; break;
    case 'fy_pqty': pl.qty = clamp(pl.qty + Number(d.v), 1, 99); break;
    case 'fy_ton': S.temp.on = !S.temp.on; break;
    case 'fy_ttype': S.temp.type = d.v; break;
    case 'fy_tqty': S.temp.qty = clamp(S.temp.qty + Number(d.v), 1, 99); break;
    case 'fy_copy': doCopy(); return;
    case 'fy_reset': nextId = 1; S = fresh(); break;
    default: return;
  }
  render();
}

root.addEventListener('click', e => {
  const b = e.target.closest('button[data-a]');
  if(b && b.dataset.a.startsWith('fy_')) act(b.dataset);
});
root.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if(isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;
  if(a === 'fy_qtyinput'){
    const l = S.lines.find(x => String(x.id)===String(id));
    if(l){ l.qty = Math.min(99, val); render(); }
  } else if(a === 'fy_pqtyinput'){
    const pl = S.plaques.find(x => String(x.id)===String(id));
    if(pl){ pl.qty = Math.min(99, val); render(); }
  } else if(a === 'fy_tqtyinput'){
    S.temp.qty = Math.min(99, val); render();
  }
});

window.__FY = { render };
render();
})();
</script>

<!-- ═════════ 腳本 2：羅東鎮壽園 ═════════ -->
<script id="script-sy">
(function(){
'use strict';
const BASE = {
  single:{lo:36000,hi:48000},
  couple:{lo:72000,hi:96000},
  urn:{'-':80000},
  family:{'6':338400,'8':434400,'10':530400,'12':626400},
  buddha:{lo:150000,hi:200000}
};
const MGF = {single:15000,couple:30000,urn:18500,buddha:30000,family:{'6':60000,'8':80000,'10':100000,'12':120000}};
const KINDS = {
  single:{name:'單人式骨甕',spec:'安置火化骨灰',unit:'位'},
  couple:{name:'雙人式骨甕',spec:'安置骨灰，2 位',unit:'組'},
  urn:{name:'骨罈（單人式）',spec:'安置骨骸（撿骨晉塔）',unit:'位'},
  family:{name:'家族式納骨位',spec:'6–12 位，附家族牌位',unit:'組'},
  buddha:{name:'佛祖區雙人位',spec:'僅壽園寶塔一樓',unit:'組'}
};
const GRPS = {
  single:[['lo','第一、二層（非平視）'],['hi','第三至八層（成人平視）']],
  couple:[['lo','第一、二層（非平視）'],['hi','第三至七層（成人平視）']],
  urn:[['-','全區標準位']],
  family:[['6','6 人家族位'],['8','8 人家族位'],['10','10 人家族位'],['12','12 人家族位']],
  buddha:[['lo','第一、二層（非平視）'],['hi','第三至八層（成人平視）']]
};
const TOWER = {ba:'壽園寶塔',fu:'福恩塔'};
const RES = {
  local:{name:'羅東鎮民',sub:'使用費減收 10%',banner:'本鎮鎮民：使用費減收 10%（長生位不適用）'},
  county:{name:'宜蘭縣民',sub:'其他鄉鎮標準價',banner:'本縣他鄉鎮市：標準價'},
  other:{name:'外縣市民',sub:'使用費加一倍（2倍）',banner:'設籍外縣市：使用費加一倍（2倍計收）'}
};
const PLAQUE = {plain:30000,pick:33000};
const TEMP = {y3:36000,perMonth:1000,mgmt:15000};
const MOVE_FEE = 10000, PRE_MOVE_FEE = 2000, RENAME_FEE = 2000;

function resFactor(pre){
  if(S.res==='local') return pre?1:0.9;
  if(S.res==='other') return 2;
  return 1;
}
function mgmtOf(kind,grp,tower){
  const m = kind==='family' ? MGF.family[grp] : MGF[kind];
  return tower==='ba' ? Math.round(m*0.6) : m;
}
const towerOf = l => l.kind==='buddha' ? 'ba' : l.tower;
const keyOf = l => towerOf(l)+':'+l.grp;

function calcLine(l){
  const tower=towerOf(l), f=resFactor(l.pre);
  const fee=Math.round(BASE[l.kind][l.grp]*f);
  const mgmt=mgmtOf(l.kind,l.grp,tower);
  const rename=(l.pre&&l.rename)?RENAME_FEE:0;
  let moveFee=0,dFee=0,dMgmt=0;
  if(l.move){
    const parts=(l.target||keyOf(l)).split(':'), tw=parts[0], g=parts[1];
    moveFee=l.pre?PRE_MOVE_FEE:MOVE_FEE;
    dFee=Math.max(0,Math.round(BASE[l.kind][g]*f)-fee);
    dMgmt=Math.max(0,mgmtOf(l.kind,g,l.kind==='buddha'?'ba':tw)-mgmt);
  }
  const unit=fee+mgmt+rename+moveFee+dFee+dMgmt;
  return {tower,fee,mgmt,rename,moveFee,dFee,dMgmt,qty:l.qty,unit,sub:unit*l.qty};
}
function calcPlaque(p){
  const base=p.pick?PLAQUE.pick:PLAQUE.plain;
  const unit=Math.round(base*resFactor(false));
  return {base,unit,qty:p.qty,sub:unit*p.qty};
}
function tempOwned(){return S.temp.owned===null ? S.lines.length>0 : S.temp.owned;}
function calcTemp(){
  const t=S.temp; if(!t.on) return null;
  const base=t.mode==='y3'?TEMP.y3:TEMP.perMonth*t.months;
  let use=Math.round(base*resFactor(false)), note='';
  if(tempOwned() && t.mode==='month' && t.months<=1){use=0; note='已購置本鎮設施，30 日內免收使用費';}
  const label=t.mode==='y3'?'臨時寄放 3 年':'臨時寄放 '+t.months+' 個月（切結期限）';
  return {label,use,mgmt:TEMP.mgmt,qty:t.qty,note,base,sub:(use+TEMP.mgmt)*t.qty};
}
function totals(){
  const t={fee:0,mgmt:0,rename:0,move:0,dFee:0,dMgmt:0,plaque:0,tempUse:0,tempMgmt:0,credit:0,all:0};
  S.lines.forEach(l=>{const r=calcLine(l);
    t.fee+=r.fee*r.qty; t.mgmt+=r.mgmt*r.qty; t.rename+=r.rename*r.qty;
    t.move+=r.moveFee*r.qty; t.dFee+=r.dFee*r.qty; t.dMgmt+=r.dMgmt*r.qty;});
  S.plaques.forEach(p=>{t.plaque+=calcPlaque(p).sub;});
  const tp=calcTemp();
  if(tp){t.tempUse=tp.use*tp.qty; t.tempMgmt=tp.mgmt*tp.qty; if(S.temp.credit) t.credit=Math.min(t.tempUse,t.fee);}
  t.all=t.fee+t.mgmt+t.rename+t.move+t.dFee+t.dMgmt+t.plaque+t.tempUse+t.tempMgmt-t.credit;
  return t;
}

const KEY='tower-calc-luodong-v9';
let nextId=1;
function newLine(){return {id:nextId++,kind:'single',tower:'ba',grp:'lo',pre:false,rename:false,qty:1,move:false,target:null};}
function fresh(){return {res:null,lines:[newLine()],plaques:[],temp:{on:false,mode:'y3',months:12,qty:1,owned:null,credit:false}};}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s && Array.isArray(s.lines) && Array.isArray(s.plaques) && s.temp){
      const ids=s.lines.concat(s.plaques).map(x=>x.id);
      nextId=(ids.length?Math.max.apply(null,ids):0)+1; return s;
    }
  }catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S = load() || fresh();

const root = document.getElementById('panel-sy');
const container = document.getElementById('app-sy-container');
const fmt = n => n.toLocaleString('en-US');
const money = n => 'NT$ '+fmt(n);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function chip(label,on,attrs,sub,cls){
  return '<button type="button" class="chip'+(on?' on':'')+(cls?' '+cls:'')+'" aria-pressed="'+(on?'true':'false')+'" '+attrs+'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';
}
function row(label,amt,note){
  return '<div class="row"><span>'+label+(note?'<small>'+note+'</small>':'')+'</span><span>'+(amt===0?'免收':(amt<0?'－'+money(-amt):money(amt)))+'</span></div>';
}
function resNote(base,pre){
  if(S.res==='local') return '標準價 '+fmt(base)+(pre?'，長生位不減收':'，鎮民減收 10%');
  if(S.res==='other') return '標準價 '+fmt(base)+' 加一倍（2倍）';
  return '標準價 '+fmt(base);
}
function stepper(act,idAttr,val,unitHint){
  return '<div class="qtyrow">'
    +'<button type="button" aria-label="減少" data-a="'+act+'"'+idAttr+' data-v="-1">−</button>'
    +'<input type="number" min="1" max="99" value="'+val+'" data-a="'+act+'input"'+idAttr+'>'
    +'<button type="button" aria-label="增加" data-a="'+act+'"'+idAttr+' data-v="1">＋</button>'
    +(unitHint?'<span class="hint" style="margin:0">'+unitHint+'</span>':'')+'</div>';
}

function qualHTML(){
  let h='<section class="card"><h2><span class="n">1</span>使用者設籍資格</h2>';
  h+='<div class="q">使用者的戶籍在哪裡？</div><div class="chips three">'
    +Object.keys(RES).map(k=>chip(RES[k].name,S.res===k,'data-a="sy_res" data-v="'+k+'"',RES[k].sub)).join('')+'</div>';

function lineHTML(l,i){

  if(GRPS[l.kind].length>1){
    h+='<div class="q">'+(l.kind==='family'?'家族人數':'層別')+'</div><div class="chips two">'

  if(S.res){
    const r=calcLine(l), q=r.qty;
    h+='<div class="calc"><div class="tier">'+TOWER[r.tower]+' '+K.name+'</div>';

    h+=row('管理費',r.mgmt*q,(q>1?money(r.mgmt)+' × '+q+'；':'')+(r.tower==='ba'?'福恩塔的 60%':'福恩塔'));
    if(r.rename) h+=row('長生位更名登記費',r.rename*q);
    if(l.move){
      h+=row(l.pre?'長生位換位登記費':'已晉塔換位費',r.moveFee*q);
      h+=row('使用費補差額',r.dFee*q,'換到較貴的才補；較便宜不退');
      h+=row('管理費補差額',r.dMgmt*q);
    }
    h+='<div class="row sum"><span>此項目小計</span><span>'+money(r.sub)+'</span></div></div>';

  return h+'</div>';
}

function itemsHTML(){
  let h='<section class="card"><h2><span class="n">2</span>塔位項目</h2>'
    +'<p class="hint">不同櫃型、層別、塔別，請分成不同項目。</p>';

}

function plaqueHTML(p,i){
  let h='<div class="line"><div class="line-h"><b>牌位 '+(i+1)+'</b>'
    +'<button type="button" class="link" data-a="sy_pdel" data-id="'+p.id+'">刪除此牌位</button></div>';

    +chip('非選位',!p.pick,'data-a="sy_ppick" data-id="'+p.id+'" data-v="0"','標準價 '+fmt(PLAQUE.plain))
    +chip('自選位',p.pick,'data-a="sy_ppick" data-id="'+p.id+'" data-v="1"','標準價 '+fmt(PLAQUE.pick))+'</div>';
  h+='<div class="q">數量（位）</div>'+stepper('sy_pqty',' data-id="'+p.id+'"',p.qty);
  if(S.res){
    const c=calcPlaque(p);
    h+='<div class="calc">'+row('牌位使用費',c.sub,(p.qty>1?money(c.unit)+' × '+p.qty+'；':'')+resNote(c.base,false))+'</div>';

function tempHTML(){

    const c=calcTemp();

      +row('臨時寄放使用費',c.use*c.qty,(c.note?c.note+'；':'')+resNote(c.base,false))

function extrasHTML(){
  let h='<section class="card"><h2><span class="n">3</span>其他項目</h2>'
    +'<div class="q" style="margin-top:14px">牌位</div><p class="hint" style="margin-top:0">牌位不提供長生位、更名、換位。</p>';
  S.plaques.forEach((p,i)=>{h+=plaqueHTML(p,i);});
  h+='<button type="button" class="btn add" data-a="sy_padd">＋ 新增牌位</button>';
  h+=tempHTML();
  return h+'</section>';
}

function descOf(l){
  const K=KINDS[l.kind], g=GRPS[l.kind].find(x=>x[0]===l.grp);
  return TOWER[towerOf(l)]+' '+K.name+(g&&g[1]?' '+g[1]:'')+(l.pre?'（預購長生位）':'');
}

function summary(){
  let s='【羅東壽園 塔位費用試算】\n使用者戶籍：'+RES[S.res].name+'（'+RES[S.res].sub+'）\n';
  S.lines.forEach((l,i)=>{
    const r=calcLine(l), q=l.qty;
    s+='\n'+(i+1)+'. '+descOf(l)+' × '+q+' '+KINDS[l.kind].unit+'\n';
    s+='   使用費 '+money(r.fee*q)+'｜管理費 '+money(r.mgmt*q);
    if(r.rename) s+='｜更名登記費 '+money(r.rename*q);
    if(l.move) s+='｜換位費 '+money(r.moveFee*q)+'｜補差額 '+money((r.dFee+r.dMgmt)*q);
    s+='\n   小計 '+money(r.sub)+'\n';
  });
  S.plaques.forEach((p,i)=>{
    const c=calcPlaque(p);
    s+='\n牌位 '+(i+1)+'. '+(p.pick?'自選位':'非選位')+' × '+p.qty+' 位\n   小計 '+money(c.sub)+'\n';
  });
  const tp=calcTemp();
  if(tp) s+='\n'+tp.label+' × '+tp.qty+' 具\n   使用費 '+money(tp.use*tp.qty)+'｜管理費 '+money(tp.mgmt*tp.qty)+'\n   小計 '+money(tp.sub)+'\n';
  const t=totals();
  if(t.credit) s+='\n臨時寄放使用費折抵：－'+money(t.credit)+'\n';
  s+='\n合計：'+money(t.all)+'\n※ 試算僅供參考，實際以羅東鎮立殯葬管理所公告與審核為準 (03) 989-8845\n'
    + '--------------------------------\n'
    + '規費標準整理：重生禮儀（簡先生）\n'
    + '諮詢電話：0922-382533\n'
    + 'LINE：https://line.me/ti/p/XF2bg2UUic';
  return s;
}

function resultHTML(){
  let h='<section class="card"><h2><span class="n">4</span>費用總計</h2>';
  if(!S.res) return h+'<p class="hint">選好第 1 步的戶籍後，這裡會顯示總金額。</p></section>';
  if(!S.lines.length && !S.plaques.length && !S.temp.on) return h+'<p class="hint">還沒有加入任何項目。</p></section>';
  const t=totals();
  if(S.lines.length){
    h+=row('塔位使用費',t.fee)+row('塔位管理費',t.mgmt);
    if(t.rename) h+=row('長生位更名登記費',t.rename);
    if(t.move) h+=row('換位費',t.move);
    if(t.dFee) h+=row('換位使用費補差額',t.dFee);
    if(t.dMgmt) h+=row('換位管理費補差額',t.dMgmt);
  }
  if(S.plaques.length) h+=row('牌位',t.plaque);
  if(S.temp.on){ h+=row('臨時寄放使用費',t.tempUse)+row('臨時寄放管理費',t.tempMgmt); }
  if(t.credit) h+=row('臨時寄放使用費折抵',-t.credit);
  h+='<div class="row total"><span>合計總額</span><span>'+money(t.all)+'</span></div>';
  h+='<div class="q">文字摘要</div><textarea class="sum" readonly rows="14">'+esc(summary())+'</textarea>';
  h+='<div class="actions"><button type="button" class="btn" data-a="sy_copy">複製摘要</button>'
    + '<button type="button" class="btn ghost" data-a="sy_reset">全部重來</button></div>';
  return h+'</section>';
}

function notesHTML(){
  return '<details><summary>羅東壽園 收費依據與說明</summary><ul>'
   +'<li>依據羅東鎮立殯葬設施使用收費標準表（115 年 7 月 16 日修訂版）試算。</li>'
   +'<li>設籍外縣市者，其使用費加一倍（2倍）計收。鎮民減收 10%（長生位除外）。</li>'
   +'<li>壽園寶塔管理費按福恩塔標準費率之 60% 計收；福恩塔按全額計收。</li>'
   +'<li>已晉塔換位費 10,000 元，較貴補差額，較低不退差額。</li>'
   +'</ul></details>';
}

function render(){
  container.innerHTML=qualHTML()+itemsHTML()+extrasHTML()+resultHTML()+notesHTML();
  document.getElementById('amt-sy').textContent = S.res ? money(totals().all) : '請先選戶籍';
  save();
}

function toast(msg){
  const t = document.getElementById('toast-sy'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function doCopy(){
  if(!S.res){toast('請先選戶籍');return;}
  const text=summary();
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(ok) toast('已複製報價，可貼到 LINE');
  else{
    toast('無法自動複製，請在文字摘要框內全選複製');
    const sum = root.querySelector('.sum'); if(sum){sum.scrollIntoView({block:'center'}); sum.focus(); sum.select();}
  }
}

function act(d){
  const l = d.id ? S.lines.find(x=>String(x.id)===String(d.id)) : null;
  const pl = d.id ? S.plaques.find(x=>String(x.id)===String(d.id)) : null;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  switch(d.a){
    case 'sy_res': S.res=d.v; break;
    case 'sy_add': S.lines.push(newLine()); break;
    case 'sy_del': S.lines=S.lines.filter(x=>x!==l); break;
    case 'sy_kind':
      l.kind=d.v; l.grp=GRPS[d.v][0][0]; l.target=null; l.move=false;
      if(d.v==='buddha') l.tower='ba';
      break;
    case 'sy_grp': l.grp=d.v; l.target=null; break;
    case 'sy_tower': l.tower=d.v; l.target=null; break;
    case 'sy_pre': l.pre=!l.pre; if(!l.pre) l.rename=false; break;
    case 'sy_rename': l.rename=!l.rename; break;
    case 'sy_qty': l.qty=clamp(l.qty+Number(d.v),1,99); break;
    case 'sy_move': l.move=!l.move; if(!l.move) l.target=null; break;
    case 'sy_target': l.target=d.v; break;
    case 'sy_padd': S.plaques.push({id:nextId++,pick:false,qty:1}); break;
    case 'sy_pdel': S.plaques=S.plaques.filter(x=>x!==pl); break;
    case 'sy_ppick': pl.pick=(d.v==='1'); break;
    case 'sy_pqty': pl.qty=clamp(pl.qty+Number(d.v),1,99); break;
    case 'sy_ton': S.temp.on=!S.temp.on; break;
    case 'sy_tmode': S.temp.mode=d.v; break;
    case 'sy_tmonths': S.temp.months=clamp(S.temp.months+Number(d.v),1,36); break;
    case 'sy_tset': S.temp.months=Number(d.v); break;
    case 'sy_towned': S.temp.owned=(d.v==='1'); break;
    case 'sy_tqty': S.temp.qty=clamp(S.temp.qty+Number(d.v),1,99); break;
    case 'sy_tcredit': S.temp.credit=!S.temp.credit; break;
    case 'sy_copy': doCopy(); return;
    case 'sy_reset': nextId=1; S=fresh(); break;
    default: return;
  }
  render();
}

root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');
  if(b && b.dataset.a.startsWith('sy_')) act(b.dataset);
});
root.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches && s.matches('select[data-a]')) act({a:s.dataset.a,id:s.dataset.id,v:s.value});
});
root.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;
  if (a === 'sy_qtyinput') {
    const l = S.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); render(); }
  } else if (a === 'sy_pqtyinput') {
    const pl = S.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); render(); }
  } else if (a === 'sy_tmonthsinput') {
    S.temp.months = Math.min(36, val); render();
  } else if (a === 'sy_tqtyinput') {
    S.temp.qty = Math.min(99, val); render();
  }
});

window.__SY = { render };
render();
})();
</script>

function feeOf(key,tier){
  const p = BOX[key];
  return ['A','D','B','C','M'].includes(tier) ? p[tier] : p[tier].fee;
}

function calcBox(l,at){
  const p = BOX[l.kind+'_'+l.grp];
  const c = [{tier:at,fee:p[at],mgmt:p.mgmt,deco:0}];
  if(l.dec==='vil') c.push({tier:'D',fee:p.D,mgmt:p.mgmt,deco:0});
  if(l.dec==='ds')  c.push({tier:'A',fee:p.A,mgmt:p.mgmt,deco:0});
  if(l.dec==='M')   c.push({tier:'M',fee:p.M,mgmt:p.mgmt,deco:0});
  if(['R','L','W'].includes(l.dec) && p[l.dec]) c.push({tier:l.dec,fee:p[l.dec].fee,mgmt:p[l.dec].mgmt,deco:p[l.dec].deco});

  c.forEach(x=>x.sum=x.fee+x.mgmt+x.deco);
  c.sort((a,b)=>a.sum-b.sum);
  const b = c[0];
  let moveFee=0, diff=0;
  if(l.move){
    moveFee = MOVE[l.kind];
    if(b.tier==='R' && (at==='A'||at==='D'||l.dec==='ds'||l.dec==='vil')) moveFee = 0;
    const tk = l.kind+'_'+(l.target||l.grp);
    diff = Math.max(0, feeOf(tk,b.tier) - b.fee);
  }
  const unit = b.fee+b.mgmt+b.deco+moveFee+diff;
  return {tier:b.tier,tierLabel:AT_LABEL[b.tier],fee:b.fee,mgmt:b.mgmt,deco:b.deco,moveFee,diff,qty:l.qty,unit,sub:unit*l.qty,better:b.tier!==at};
}

function calcFam(l,at){
  const base = {A:'H',D:'H',B:'F',C:'E'}[at];
  const tiers = [base];
  if(l.dec==='ds') tiers.push('H');
  if(l.dec==='M') tiers.push('G');
  if(l.dec==='R') tiers.push('H');
  if(l.half) tiers.push('H');
  let best=null;
  tiers.forEach(t=>{const f=famFee(l.fam,t); if(!best||f<best.fee) best={tier:t,fee:f};});
  const b = {tier:best.tier,fee:best.fee,mgmt:famMgmt(l.fam),deco:0};
  let moveFee=0, diff=0;
  if(l.move){
    moveFee = MOVE.family;
    diff = Math.max(0, famFee(l.target||l.fam,b.tier) - b.fee);
  }
  const unit = b.fee+b.mgmt+b.deco+moveFee+diff;
  return {tier:b.tier,tierLabel:FT_LABEL[b.tier],fee:b.fee,mgmt:b.mgmt,deco:b.deco,moveFee,diff,qty:l.qty,unit,sub:unit*l.qty,better:b.tier!==base};
}
const calc = (l,at) => l.kind==='family' ? calcFam(l,at) : calcBox(l,at);

const PLAQUE = {s:{name:'小型',spec:'9×23×3.5cm',price:30000},l:{name:'大型',spec:'16×23×6cm',price:50000}};
function calcPlaque(p){
  const base=PLAQUE[p.size].price, pick=p.pick?Math.round(base*0.1):0;
  return {base,pick,qty:p.qty,unit:base+pick,sub:(base+pick)*p.qty};
}
function tempOwned(){return S.temp.owned===null ? S.lines.length>0 : S.temp.owned;}
function calcTemp(){
  const t=S.temp; if(!t.on) return null;
  let unit,label,note='';
  if(t.mode==='half'){unit=3000;label='臨時寄存半年期優惠';}
  else if(t.mode==='year'){unit=6000;label='臨時寄存一年期優惠';}
  else{
    const free=tempOwned()?30:0, pay=Math.max(0,t.days-free);
    unit=pay*200;
    label='按日計費 '+t.days+' 天';
    note=free?('已購置存放設施，前 30 天免收；計費 '+pay+' 天 × 200'):'每日 200 元';
  }
  return {label,note,unit,qty:t.qty,sub:unit*t.qty};
}
function totals(res){
  const t={fee:0,mgmt:0,deco:0,move:0,diff:0,plaque:0,temp:0,all:0};
  res.forEach(r=>{ if(!r) return;
    t.fee+=r.fee*r.qty; t.mgmt+=r.mgmt*r.qty; t.deco+=r.deco*r.qty;
    t.move+=r.moveFee*r.qty; t.diff+=r.diff*r.qty; t.all+=r.sub; });
  S.plaques.forEach(p=>{t.plaque+=calcPlaque(p).sub;});
  const tp=calcTemp(); if(tp) t.temp=tp.sub;
  t.all+=t.plaque+t.temp;
  return t;
}

      +chip('是',own===true,'data-a="my_towned" data-v="1"', '一個月內免收')
      +chip('否',own===false,'data-a="my_towned" data-v="0"')+'</div>';
  }
  h+='<div class="q">數量（份）</div><div class="qtyrow">'
    +'<button type="button" aria-label="減少" data-a="my_tqty" data-id="my_temp" data-v="-1">−</button>'
    +'<input type="number" min="1" max="99" value="' + t.qty + '" data-a="my_tqtyinput">'
    +'<button type="button" aria-label="增加" data-a="my_tqty" data-id="my_temp" data-v="1">＋</button></div>';
  const c=calcTemp();
  h+='<div class="calc"><div class="tier">'+c.label+'</div>'
    +row('臨時寄放費',c.sub,(c.note?c.note+'；':'')+money(c.unit)+' × '+c.qty)+'</div>';
  return h;
}

function extrasHTML(){
  let h='<section class="card"><h2><span class="n">3</span>其他項目</h2>'
    +'<div class="q" style="margin-top:14px">神主牌位</div><p class="hint" style="margin-top:0">牌位沒有戶籍優惠，一律標準價。</p>';
  S.plaques.forEach((p,i)=>{h+=plaqueHTML(p,i);});
  h+='<button type="button" class="btn add" data-a="my_padd">＋ 新增神主牌位</button>';
  h+=tempHTML();
  return h+'</section>';
}

function resultHTML(at,res){
  let h='<section class="card"><h2><span class="n">4</span>費用總計</h2>';
  const ready = !S.lines.length || at;
  const tot = ready ? totals(res) : { fee:0, mgmt:0, deco:0, move:0, diff:0, plaque:0, temp:0, all:0 };

  if (S.lines.length && !at) {
    h += '<p class="hint" style="color:var(--accent)">請先在步驟 1 回答申請人設籍問題，即可自動試算出精準金額與價級。</p>';
  } else if (S.lines.length) {
    h += row('堂位使用規費', tot.fee) + row('管理費', tot.mgmt);
    if (tot.deco) h += row('儲櫃（裝潢）費', tot.deco);
    if (tot.move) h += row('換位費', tot.move);
    if (tot.diff) h += row('換位補差額', tot.diff);
  }
  if (S.plaques.length) h += row('神主牌位', tot.plaque);
  if (S.temp.on) h += row('臨時寄放', tot.temp);

  h += '<div class="row total"><span>合計總額</span><span>' + (ready ? money(tot.all) : '請先填資格') + '</span></div>';
  h += '<div class="q">文字摘要</div><textarea class="sum" readonly rows="14">' + esc(summary(at, res)) + '</textarea>';
  h += '<div class="actions"><button type="button" class="btn" data-a="my_copy">複製摘要</button>'
    + '<button type="button" class="btn ghost" data-a="my_reset">全部重來</button></div></section>';
  return h;
}

function notesHTML(){
  return '<details><summary>冬山梅園 收費依據與說明</summary><ul>'
   +'<li>依據冬山鄉立殯葬管理所「收費標準」（109.2.1 版）自治條例編製。電話 (03) 951-5677。</li>'
   +'<li>各級優惠不重複累加，系統會在申請人與受葬亡者身分中自動選取最優惠價。</li>'
   +'<li>低收入戶死亡者：堂位使用規費全免，由所方指定位置；選平視層補繳 5,000 元差額。</li>'
   +'</ul></details>';
}

function render(){
  container.innerHTML = qualHTML(at) + itemsHTML(res) + extrasHTML() + resultHTML(at, res) + notesHTML();
  const ready = !S.lines.length || at;
  document.getElementById('amt-my').textContent = ready ? money(totals(res).all) : '請先填資格';
  save();
}

function toast(msg){
  const t = document.getElementById('toast-my'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function doCopy(){
  const atVal = appTier();
  if(S.lines.length && !atVal){ toast('請先完成步驟1申請人資格'); return; }
  const text = summary(atVal, S.lines.map(l=>calc(l, atVal)));
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    try{
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
    }catch(e2){}
  }
  if(ok) toast('已複製報價，可貼到 LINE');
  else{
    toast('無法自動複製，請在文字摘要框內全選複製');
    const sum = root.querySelector('.sum'); if(sum){ sum.scrollIntoView({block:'center'}); sum.focus(); sum.select(); }
  }
}

function act(d){
  const l = d.id ? S.lines.find(x=>String(x.id)===String(d.id)) : null;
  const pl = d.id ? S.plaques.find(x=>String(x.id)===String(d.id)) : null;
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  switch(d.a){
    case 'my_res': S.res=d.v; S.yr3=S.vil=S.yl1=null; break;
    case 'my_yn':
      S[d.f]=(d.v==='1');
      if(d.f==='yr3'){S.vil=null;S.yl1=null;}
      break;
    case 'my_add': S.lines.push(newLine()); break;
    case 'my_del': S.lines=S.lines.filter(x=>x!==l); break;
    case 'my_kind':
      l.kind=d.v; l.grp=(d.v==='urn'?'hi':'eye'); l.half=false; l.move=false; l.target=null;
      if(!KINDS[d.v].decs.includes(l.dec)) l.dec='none';
      break;
    case 'my_grp': l.grp=d.v; l.target=null; break;
    case 'my_fam': l.fam=d.v; l.target=null; break;
    case 'my_dec': l.dec=d.v; break;
    case 'my_half': l.half=!l.half; break;
    case 'my_qty': l.qty=Math.max(1,Math.min(99,l.qty+Number(d.v))); break;
    case 'my_move': l.move=!l.move; if(!l.move) l.target=null; break;
    case 'my_target': l.target=d.v; break;
    case 'my_copy': doCopy(); return;
    case 'my_padd': S.plaques.push({id:nextId++,size:'s',pick:false,qty:1}); break;
    case 'my_pdel': S.plaques=S.plaques.filter(x=>x!==pl); break;
    case 'my_psize': pl.size=d.v; break;
    case 'ppick': pl.pick=!pl.pick; break;
    case 'pqty': pl.qty=clamp(pl.qty+Number(d.v),1,99); break;
    case 'my_ton': S.temp.on=!S.temp.on; break;
    case 'my_tmode': S.temp.mode=d.v; break;
    case 'my_tdays': S.temp.days=clamp(S.temp.days+Number(d.v),1,60); break;
    case 'my_tset': S.temp.days=Number(d.v); break;
    case 'towned': S.temp.owned=(d.v==='1'); break;
    case 'my_tqty': S.temp.qty=clamp(S.temp.qty+Number(d.v),1,99); break;
    case 'my_reset': nextId=1; S=fresh(); break;
    default: return;
  }
  update();
}

root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');
  if(b && b.dataset.a.startsWith('my_')) act(b.dataset);
});
root.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches && s.matches('select[data-a]')) act({a:s.dataset.a,id:s.dataset.id,v:s.value});
});
root.addEventListener('input', e => {
  const inp = e.target;
  const val = parseInt(inp.value, 10);
  if (isNaN(val) || val < 1) return;
  const a = inp.dataset.a;
  const id = inp.dataset.id;
  if (a === 'my_qtyinput') {
    const l = S.lines.find(x => String(x.id) === String(id));
    if (l) { l.qty = Math.min(99, val); update(); }
  } else if (a === 'my_pqtyinput') {
    const pl = S.plaques.find(x => String(x.id) === String(id));
    if (pl) { pl.qty = Math.min(99, val); update(); }
  } else if (a === 'my_tdaysinput') {
    S.temp.days = Math.min(60, val); update();
  } else if (a === 'my_tqtyinput') {
    S.temp.qty = Math.min(99, val); update();
  }
});

let at, res;
function update(){
  at = appTier();
  res = S.lines.map(l=>at?calc(l,at):null);
  render();
}
window.__MY = { render: update };
update();
})();
</script>

<!-- ═════════ 腳本 4：頂部頁籤切換主控 ═════════ -->
<script id="script-tabs">
(function(){
  'use strict';
  const KEY = 'tower-calc-tab-v10';
  const tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]:not(.disabled)'));
  function show(id, scroll){
    tabs.forEach(t => {
      const on = t.dataset.panel === id;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.classList.toggle('on', on);
      const p = document.getElementById(t.dataset.panel);
      if(p) p.hidden = !on;
    });
    try{ localStorage.setItem(KEY, id); }catch(e){}
    if(scroll) window.scrollTo(0,0);
  }
  tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.panel, true)));
  let cur = 'panel-fy';
  try{ cur = localStorage.getItem(KEY) || cur; }catch(e){}
  if(!document.getElementById(cur)) cur = 'panel-fy';
  show(cur, false);
})();
</script>
